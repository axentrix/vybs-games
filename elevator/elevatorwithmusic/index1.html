<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Elevator</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a1a; }
    body { display: flex; justify-content: center; }
    .stage { position: relative; width: 100%; max-width: 393px; height: 100%; overflow: hidden; background: #14122b; }
    #riveCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  </style>
</head>
<body>
  <div class="stage"><canvas id="riveCanvas"></canvas></div>

  <script src="https://unpkg.com/@rive-app/canvas@2.47.1"></script>
  <script>
    const canvas = document.getElementById("riveCanvas");

    // ---------- Rive ----------
    const r = new rive.Rive({
      src: "./elevator.riv",
      canvas,
      artboard: "Main",
      stateMachines: "State Machine 1",
      autoplay: true,
      autoBind: false,
      layout: new rive.Layout({ fit: rive.Fit.Cover, alignment: rive.Alignment.Center }),
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        const vm = r.viewModelByName("ElevatorVM");
        if (vm) {
          const vmi = vm.defaultInstance() || vm.instance();
          r.bindViewModelInstance(vmi);
          watchMusic(vmi);
          // Nothing in the Rive file starts the trip on its own
          vmi.trigger("startMovingTrigger")?.trigger();
        } else {
          console.warn("ElevatorVM not found");
        }
      },
      onLoadError: (err) => console.error("Rive load error:", err)
    });
    window.addEventListener("resize", () => r.resizeDrawingSurfaceToCanvas());

    // ---------- Background music (played outside Rive) ----------
    const music = new Audio("./bg_music.mp3");
    music.loop = true;
    music.volume = 0.3; // MUSIC_VOLUME

    const MUSIC_VOLUME = 0.3;
    const MUSIC_FADE_MS = 1500;
    let musicStopped = false;

    function playMusic() {
      if (musicStopped) return;
      music.play().catch(() => {}); // blocked until the first tap
    }

    // Fades out and stops for good
    function stopMusic(reason) {
      if (musicStopped) return;
      musicStopped = true;
      console.log(`${reason}: music fading out`);
      const startVol = music.volume;
      const t0 = performance.now();
      (function step(now) {
        const k = Math.min(1, (now - t0) / MUSIC_FADE_MS);
        music.volume = startVol * (1 - k);
        if (k < 1) requestAnimationFrame(step);
        else music.pause();
      })(t0);
    }

    // ElevatorVM trigger, or boolean turning true -> music stops
    const MUSIC_STOP_ON = [
      "allFloorsDone",     // reached the top floor, celebration + leaving
      "leavePressed",      // cashout: Leave in the cashout popup
      "isLeaving",
      "astronautFlyAway",
      "leaveTrigger"
    ];

    // A bomb this soon after the shield turns on / is used up counts as blocked
    const SHIELD_GRACE_MS = 1000;

    function watchMusic(vmi) {
      function onFire(name, cb) {
        const trig = vmi.trigger(name);
        if (trig) { trig.on(cb); return; }
        const flag = vmi.boolean(name);
        if (flag) { flag.on(() => { if (flag.value) cb(); }); return; }
        console.warn(`${name} not found on ElevatorVM`);
      }

      for (const name of MUSIC_STOP_ON) onFire(name, () => stopMusic(name));

      // Bomb: only when the shield didn't block it
      let lastShieldAt = -Infinity;
      const hasShield = vmi.boolean("hasShield");
      hasShield?.on(() => { lastShieldAt = performance.now(); });
      vmi.trigger("shieldOnTrigger")?.on(() => { lastShieldAt = performance.now(); });
      const shielded = () =>
        !!hasShield?.value || performance.now() - lastShieldAt < SHIELD_GRACE_MS;

      const isFail = vmi.boolean("isFail");
      isFail?.on(() => {
        if (!isFail.value || shielded()) return;
        // Re-check once the bomb resolves, in case the shield kicked in
        setTimeout(() => {
          if (isFail.value && !shielded()) stopMusic("bomb");
        }, SHIELD_GRACE_MS);
      });
    }
    playMusic();
    // Browsers block autoplay with sound until the user interacts
    window.addEventListener("pointerdown", playMusic, { once: true, capture: true });

    // Pause while the tab is in the background
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) music.pause();
      else if (!music.paused || music.currentTime > 0) playMusic();
    });
  </script>
</body>
</html>
