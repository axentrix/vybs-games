<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Elevator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #0b0a1a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img { display: block; }

    /* =====================================================
       FRAME
       ===================================================== */

    /* Desktop: fixed phone-sized frame */
    .frame {
      position: relative;
      width: 393px;
      height: 852px;
      max-height: 100dvh;
      border-radius: 28px;
      overflow: hidden;
      background-color: #14122b;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      /* Lets the top bar scale with the frame width (cqw) */
      container-type: size;
    }

    /* Mobile: edge to edge, full screen */
    @media (max-width: 480px) {
      .frame {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    #riveCanvas,
    #currencyCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .status {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 24px;
      z-index: 30;
      text-align: center;
      color: #fff;
      font-size: 14px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    /* =====================================================
       TOP BAR (Figma 8075:211832, in a 311-wide frame; scaled to the frame
       width with --u = 1 design px)
       ===================================================== */

    .top-bar {
      --u: calc(100cqw / 311);
      position: absolute;
      top: calc(50 * var(--u));
      left: calc(17 * var(--u));
      right: calc(17 * var(--u));
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .top-bar[hidden] { display: none; }

    .utility-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: calc(19.852 * var(--u));
      height: calc(19.852 * var(--u));
      border: none;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.12);
      cursor: pointer;
      pointer-events: auto;
    }

    .utility-button:active { transform: scale(0.94); }

    .utility-button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .utility-button .back {
      width: calc(6.52 * var(--u));
      height: calc(6.52 * var(--u));
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: calc(6 * var(--u));
    }

    .utility-button .sound {
      width: calc(9 * var(--u));
      height: calc(9 * var(--u));
    }

    .utility-button .help {
      width: calc(4.223 * var(--u));
      height: calc(6.334 * var(--u));
    }

    /* =====================================================
       SPLASH
       ===================================================== */

    .splash {
      position: absolute;
      inset: 0;
      z-index: 5;
    }

    .splash img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =====================================================
       OVERLAYS (shield, result, reward)
       ===================================================== */

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(5, 4, 18, 0.7);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .overlay.show { opacity: 1; }
    .overlay[hidden] { display: none; }

    .card {
      border: none;
      background: none;
      cursor: pointer;
    }

    .card img {
      width: 284px;
      max-width: 100%;
      height: auto;
    }

    .card:active { transform: scale(0.98); }

    .card:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.6);
      outline-offset: 4px;
      border-radius: 16px;
    }

    .result img {
      width: 284px;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Plays over the result, transparent so the result shows through */
    .reward-overlay {
      z-index: 20;
      padding: 0;
      background: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="frame" id="frame">

    <canvas id="riveCanvas"></canvas>

    <!-- Shown over the Rive screen once it loads -->
    <div class="top-bar" id="topBar" hidden>
      <div class="top-bar-left">
        <button class="utility-button" id="backButton" aria-label="Back">
          <img class="back" src="./assets/back.svg" alt="" />
        </button>
        <button class="utility-button" id="soundButton" aria-label="Mute sound" aria-pressed="false">
          <img class="sound" id="soundIcon" src="./assets/sound-on.svg" alt="" />
        </button>
      </div>
      <button class="utility-button" id="helpButton" aria-label="Help">
        <img class="help" src="./assets/help.svg" alt="" />
      </button>
    </div>

    <div class="splash" id="splash">
      <img src="./Splash.png" alt="Elevator" />
    </div>

    <div class="overlay" id="shieldOverlay" hidden>
      <button class="card" id="shieldButton" aria-label="Start">
        <img src="./shield.png" alt="" />
      </button>
    </div>

    <div class="overlay result" id="resultOverlay" hidden>
      <img id="resultImage" alt="" />
    </div>

    <div class="overlay reward-overlay" id="rewardOverlay" hidden>
      <canvas id="currencyCanvas"></canvas>
    </div>

    <div class="status" id="status"></div>

  </div>

  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>

  <script>

    // =====================================================
    // CONFIG
    // =====================================================

    const RIVE_SRC = "./elevator.riv";
    const ARTBOARD = "Main";
    const STATE_MACHINE = "State Machine 1";
    const VIEW_MODEL = "ElevatorVM";
    const START_TRIGGER = "startMovingTrigger";

    // Every Nth floor is a safe floor (no bombs, shown in the background).
    // 0 turns safe floors off. ?safeEvery=4 in the URL overrides it.
    const SAFE_FLOOR_EVERY =
      Number(new URLSearchParams(location.search).get("safeEvery") ?? 5);

    // Seconds the boxes wait on a safe floor, so the safe floor reveal plays
    // first. 0 shows them right away. ?safeBoxesDelay=2 in the URL overrides it.
    const SAFE_FLOOR_BOXES_DELAY =
      Number(new URLSearchParams(location.search).get("safeBoxesDelay") ?? 1.5);

    // Splash stays alone this long before the shield overlay appears
    const SHIELD_DELAY_MS = 2000;

    // Once the game ends, the result shows on the next tap. Taps this soon
    // after the end are ignored, so the tap that ended it doesn't count.
    const END_TAP_ARM_MS = 500;

    // A bomb within this long of the shield turning on or being used up
    // counts as blocked, and isFail is re-checked after it before game over
    const SHIELD_GRACE_MS = 1000;

    const SOUND_DIR = "./music/";
    // Loops from the moment the elevator starts
    const BG_MUSIC = "bg_music.m4a";
    const BG_MUSIC_VOLUME = 0.3;
    const SFX_VOLUME = 0.6;
    // ElevatorVM trigger or boolean (on turning true) -> sound
    const SOUND_ON = {
      isLeaving: "astronaut_leave.aac",
      isSafeFloor: "safe_floor.aac",
      shieldOnTrigger: "shield.aac",
      doorClose: "door_closes.aac",
      doorOpen: "door_opens.mp3",
      isOpened: "reward_open.aac",
      collect: "reward_fly.aac"
    };
    // isFail turning true without a shield: both play and the music fades out
    const BOMB_SOUND = "bomb.aac";
    const GAME_OVER_SOUND = "game_over.aac";
    // Ending trigger or boolean -> sound, and the music fades out
    const END_SOUND_ON = {
      allFloorsDone: "happy_end.aac"
    };
    const MUSIC_FADE_S = 1.5;

    const RESULT_IMAGES = {
      left: "./gameleft.png",
      over: "./gameover.png",
      completed: "./gamecompleted.png"
    };

    const CURRENCY_SRC = "./trial_currency.riv";
    const CURRENCY_VM = "CurrencyVM";
    const CONFETTI_COUNT = 30;
    // Size of the flying tokens relative to their size in the Rive file.
    // The artboard is resized to the screen (Fit.Layout), so this scales only the content.
    const TOKEN_SCALE = 0.6;
    // The reward overlay closes this long after it opens
    const REWARD_MS = 3500;


    const frame = document.getElementById("frame");
    const canvas = document.getElementById("riveCanvas");
    const statusEl = document.getElementById("status");
    const splash = document.getElementById("splash");
    const topBar = document.getElementById("topBar");
    const shieldOverlay = document.getElementById("shieldOverlay");
    const shieldButton = document.getElementById("shieldButton");
    const resultOverlay = document.getElementById("resultOverlay");
    const resultImage = document.getElementById("resultImage");
    const rewardOverlay = document.getElementById("rewardOverlay");
    const currencyCanvas = document.getElementById("currencyCanvas");

    let riveAnimation = null;
    let currencyAnimation = null;
    let vmi = null;
    let ended = false;
    let lastShieldAt = -Infinity;


    // =====================================================
    // OVERLAY HELPERS
    // =====================================================

    function showOverlay(el) {
      el.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));
    }

    function hideOverlay(el, done) {
      el.classList.remove("show");
      el.addEventListener("transitionend", () => {
        el.hidden = true;
        done?.();
      }, { once: true });
    }


    // =====================================================
    // SOUND
    // =====================================================

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    // Every sound goes through this, so muting is one switch
    const masterGain = audioContext.createGain();
    masterGain.connect(audioContext.destination);
    const sounds = {};
    let musicWanted = false;
    let musicStarted = false;
    let musicEnded = false;
    let music = null;

    // Fetched and decoded up front so the first play isn't late
    const soundFiles = [BG_MUSIC, BOMB_SOUND, GAME_OVER_SOUND, ...Object.values(SOUND_ON), ...Object.values(END_SOUND_ON)];
    for (const file of new Set(soundFiles)) {
      fetch(SOUND_DIR + file)
        .then((res) => res.arrayBuffer())
        .then((data) => audioContext.decodeAudioData(data))
        .then((buffer) => {
          sounds[file] = buffer;
          if (file === BG_MUSIC && musicWanted) startMusic();
        })
        .catch((err) => console.warn(`Could not load ${file}:`, err));
    }

    function playSound(file, volume = SFX_VOLUME, loop = false) {
      const buffer = sounds[file];
      if (!buffer) return;
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.loop = loop;
      const gain = audioContext.createGain();
      gain.gain.value = volume;
      source.connect(gain).connect(masterGain);
      source.start();
      return { source, gain };
    }

    // Top bar button: mutes everything, music keeps running silently
    const soundButton = document.getElementById("soundButton");
    const soundIcon = document.getElementById("soundIcon");

    soundButton.addEventListener("click", () => {
      const muted = masterGain.gain.value > 0;
      masterGain.gain.value = muted ? 0 : 1;
      soundIcon.src = muted ? "./assets/sound-off.svg" : "./assets/sound-on.svg";
      soundButton.setAttribute("aria-pressed", String(muted));
      soundButton.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
    });

    // Must first run from a tap: browsers keep audio locked until then
    function startMusic() {
      musicWanted = true;
      audioContext.resume();
      if (musicStarted || musicEnded || !sounds[BG_MUSIC]) return;
      musicStarted = true;
      music = playSound(BG_MUSIC, BG_MUSIC_VOLUME, true);
    }

    function fadeOutMusic() {
      musicEnded = true;
      if (!music) return;
      const now = audioContext.currentTime;
      music.gain.gain.setValueAtTime(music.gain.gain.value, now);
      music.gain.gain.linearRampToValueAtTime(0, now + MUSIC_FADE_S);
      music.source.stop(now + MUSIC_FADE_S);
      music = null;
    }

    // Quiet while the tab is in the background
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) audioContext.suspend();
      else if (musicWanted) audioContext.resume();
    });


    // =====================================================
    // SPLASH -> SHIELD -> ELEVATOR
    // =====================================================

    setTimeout(() => showOverlay(shieldOverlay), SHIELD_DELAY_MS);

    shieldButton.addEventListener("click", () => {
      if (riveAnimation) return;
      startMusic();
      statusEl.textContent = "Loading…";
      loadElevator();
    });


    // =====================================================
    // LOAD ELEVATOR
    // =====================================================

    function loadElevator() {

      riveAnimation = new rive.Rive({

        src: RIVE_SRC,
        canvas: canvas,
        artboard: ARTBOARD,
        // Must be set here: without it the runtime also plays the artboard's
        // first timeline, which fights the state machine (boxes never show)
        stateMachines: STATE_MACHINE,
        autoplay: true,
        autoBind: false,

        layout: new rive.Layout({
          fit: rive.Fit.Cover,
          alignment: rive.Alignment.Center
        }),

        onLoad: () => {

          const viewModel = riveAnimation.viewModelByName(VIEW_MODEL);

          if (!viewModel) {
            console.error(`${VIEW_MODEL} not found`);
            statusEl.textContent = "View model not found";
            return;
          }

          vmi = viewModel.defaultInstance() || viewModel.instance();
          riveAnimation.bindViewModelInstance(vmi);

          const safeFloorEvery = vmi.number("safeFloorEvery");
          if (safeFloorEvery) {
            safeFloorEvery.value = SAFE_FLOOR_EVERY;
          } else {
            console.warn(`safeFloorEvery not found on ${VIEW_MODEL}`);
          }

          const safeBoxesDelay = vmi.number("safeFloorBoxesDelay");
          if (safeBoxesDelay) {
            safeBoxesDelay.value = SAFE_FLOOR_BOXES_DELAY;
          } else {
            console.warn(`safeFloorBoxesDelay not found on ${VIEW_MODEL}`);
          }

          watchGame();
          watchSounds();

          // Nothing in the Rive file starts the trip on its own
          const startTrigger = vmi.trigger(START_TRIGGER);
          if (startTrigger) {
            startTrigger.trigger();
            console.log(`${START_TRIGGER} fired`);
          } else {
            console.error(`${START_TRIGGER} not found on ${VIEW_MODEL}`);
          }

          statusEl.textContent = "";
          resizeRive();
          requestAnimationFrame(resizeRive);

          // Reveal the elevator only once it has drawn
          splash.hidden = true;
          topBar.hidden = false;
          hideOverlay(shieldOverlay);

        },

        onLoadError: (err) => {
          console.error("RIVE LOAD ERROR:", err);
          statusEl.textContent = "Failed to load elevator";
          riveAnimation = null;
        }

      });

    }


    // =====================================================
    // GAME ENDINGS
    // =====================================================

    // Calls back when a trigger fires, or when a boolean turns true
    function onFire(name, callback) {
      const trigger = vmi.trigger(name);
      if (trigger) {
        trigger.on(callback);
        return;
      }
      const flag = vmi.boolean(name);
      if (flag) {
        flag.on(() => { if (flag.value) callback(); });
        return;
      }
      console.warn(`${name} not found on ${VIEW_MODEL}`);
    }

    function watchGame() {

      // Leave button in Rive. leaveTrigger fires once the leave outro
      // (astronaut flying out, capybara shrugging) has played.
      onFire("leaveTrigger", () => endGame("left"));

      // Shield: note when it's switched on or used up, so a bomb it
      // blocks doesn't end the game
      const hasShield = vmi.boolean("hasShield");
      hasShield?.on(() => { lastShieldAt = performance.now(); });
      onFire("shieldOnTrigger", () => { lastShieldAt = performance.now(); });

      // Bomb
      const isFail = vmi.boolean("isFail");
      isFail?.on(() => {
        if (!isFail.value || shielded()) return;
        // Check again once the bomb has resolved: the shield may have
        // kicked in, or the script may have cleared isFail
        setTimeout(() => {
          if (isFail.value && !shielded()) endGame("over");
        }, SHIELD_GRACE_MS);
      });

      // Last floor reached
      const currentFloor = vmi.number("currentFloor");
      const maxFloor = vmi.number("maxFloor");
      currentFloor?.on(() => {
        if (maxFloor?.value > 0 && currentFloor.value >= maxFloor.value) {
          endGame("completed");
        }
      });

    }

    function watchSounds() {
      for (const [name, file] of Object.entries(SOUND_ON)) {
        onFire(name, () => playSound(file));
      }

      for (const [name, file] of Object.entries(END_SOUND_ON)) {
        onFire(name, () => playEndSound(name, file));
      }

      // Same shield check as the game over, so a blocked bomb stays quiet
      const isFail = vmi.boolean("isFail");
      isFail?.on(() => {
        if (!isFail.value || shielded()) return;
        playSound(BOMB_SOUND);
        playEndSound("isFail", GAME_OVER_SOUND);
      });
    }

    function playEndSound(name, file) {
      console.log(`${name}: playing ${file}, fading music`);
      fadeOutMusic();
      playSound(file);
    }

    function shielded() {
      return !!vmi.boolean("hasShield")?.value
        || performance.now() - lastShieldAt < SHIELD_GRACE_MS;
    }

    function readNumber(name) {
      return vmi.number(name)?.value || 0;
    }

    function totalWon() {
      return readNumber("totalDollars") + readNumber("totalVpx") + readNumber("totalBooster");
    }

    function endGame(kind) {
      if (ended) return;
      ended = true;

      // A bomb takes everything, so only leaving or finishing pays out
      const won = kind !== "over" && totalWon() > 0;
      console.log(`game ${kind}${won ? `, won ${totalWon()}` : ""}`);

      const armedAt = performance.now() + END_TAP_ARM_MS;

      // pointerdown, not click: the Rive canvas can swallow clicks on touch
      function onTap(event) {
        if (performance.now() < armedAt) return;
        // The back and sound buttons keep working without showing the result
        if (topBar.contains(event.target)) return;
        frame.removeEventListener("pointerdown", onTap, true);
        resultImage.src = RESULT_IMAGES[kind];
        showOverlay(resultOverlay);
        if (won) showReward();
      }

      frame.addEventListener("pointerdown", onTap, true);
    }


    // =====================================================
    // REWARD OVERLAY (trial_currency.riv)
    // =====================================================

    function setNumber(target, name, value) {
      try {
        target.number(name).value = value;
      } catch (err) {
        console.warn("Could not set number:", name, err);
      }
    }

    function hideReward() {
      hideOverlay(rewardOverlay, () => {
        currencyAnimation?.cleanup();
        currencyAnimation = null;
      });
    }

    function showReward() {

      rewardOverlay.hidden = false;

      currencyAnimation = new rive.Rive({
        src: CURRENCY_SRC,
        canvas: currencyCanvas,
        stateMachines: "State Machine 1",
        autoplay: true,
        layout: new rive.Layout({
          fit: rive.Fit.Layout,
          layoutScaleFactor: TOKEN_SCALE,
          alignment: rive.Alignment.Center
        }),

        onLoad: () => {
          currencyAnimation.resizeDrawingSurfaceToCanvas();
          requestAnimationFrame(() => rewardOverlay.classList.add("show"));
          setTimeout(hideReward, REWARD_MS);

          const vm = currencyAnimation.viewModelByName?.(CURRENCY_VM);
          if (!vm) {
            console.warn(CURRENCY_VM + " not found");
            return;
          }

          const currencyVM = vm.defaultInstance?.() || vm.instance?.();
          currencyAnimation.bindViewModelInstance(currencyVM);

          // Trail runs from the middle of the screen up to the top.
          // With Fit.Layout the artboard spans the whole canvas.
          const w = currencyAnimation.artboardWidth;
          const h = currencyAnimation.artboardHeight;
          setNumber(currencyVM, "startX", w / 2);
          setNumber(currencyVM, "startY", h / 2);
          setNumber(currencyVM, "endX", w / 2);
          setNumber(currencyVM, "endY", h * 0.08);
          setNumber(currencyVM, "confettiCount", CONFETTI_COUNT);

          currencyVM.trigger("confettiTrigger")?.trigger();
        },

        onLoadError: (err) => {
          console.error("[rive] failed to load currency:", err);
          rewardOverlay.hidden = true;
        }
      });

    }


    // =====================================================
    // RESIZE
    // =====================================================

    function resizeRive() {
      riveAnimation?.resizeDrawingSurfaceToCanvas();
      currencyAnimation?.resizeDrawingSurfaceToCanvas();
    }

    window.addEventListener("resize", resizeRive);

    new ResizeObserver(resizeRive).observe(frame);

    window.addEventListener("orientationchange", () => {
      setTimeout(resizeRive, 100);
    });

  </script>

</body>
</html>
