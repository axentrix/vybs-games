<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Elevator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #0b0a1a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =====================================================
       CANVAS WRAPPER
       ===================================================== */

    /* Desktop: fixed phone-sized frame */
    .canvas-wrapper {
      position: relative;
      width: 393px;
      height: 852px;
      border-radius: 28px;
      overflow: hidden;
      background-color: #14122b;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    /* Mobile: edge to edge, full screen */
    @media (max-width: 480px) {
      .canvas-wrapper {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    #riveCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .status {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 24px;
      z-index: 2;
      text-align: center;
      color: #fff;
      font-size: 14px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    /* =====================================================
       START OVERLAY
       ===================================================== */

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 4, 18, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 0.3s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-button {
      padding: 16px 36px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(180deg, #7b5cff 0%, #5236d6 100%);
      border: none;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(82, 54, 214, 0.5);
      cursor: pointer;
    }

    .start-button:active {
      transform: scale(0.97);
    }

    .start-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .start-button:focus-visible {
      outline: 3px solid rgba(123, 92, 255, 0.6);
      outline-offset: 3px;
    }
  </style>
</head>
<body>

  <div class="canvas-wrapper">
    <canvas id="riveCanvas"></canvas>
    <div class="status" id="status">Loading…</div>
    <div class="overlay" id="overlay">
      <button class="start-button" id="startButton" disabled>Start Elevator</button>
    </div>
  </div>

  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>

  <script>

    // =====================================================
    // CONFIG
    // =====================================================

    const RIVE_SRC = "./elevator.riv";
    const ARTBOARD = "Main";
    const STATE_MACHINE = "State Machine 1";
    const VIEW_MODEL = "ElevatorVM";
    const START_TRIGGER = "startMovingTrigger";


    const canvas = document.getElementById("riveCanvas");
    const statusEl = document.getElementById("status");
    const overlay = document.getElementById("overlay");
    const startButton = document.getElementById("startButton");

    let startTrigger = null;


    // =====================================================
    // LOAD RIVE
    // =====================================================

    const riveAnimation = new rive.Rive({

      src: RIVE_SRC,
      canvas: canvas,
      artboard: ARTBOARD,
      // Must be set here: without it the runtime also plays the artboard's
      // first timeline, which fights the state machine (boxes never show)
      stateMachine: STATE_MACHINE,
      autoplay: true,
      autoBind: false,

      layout: new rive.Layout({
        fit: rive.Fit.Cover,
        alignment: rive.Alignment.Center
      }),

      onLoad: () => {

        console.log("State machines in artboard:", riveAnimation.stateMachineNames);
        console.log("Playing state machine:", STATE_MACHINE);

        const viewModel = riveAnimation.viewModelByName(VIEW_MODEL);

        if (!viewModel) {
          console.error(`${VIEW_MODEL} not found`);
          statusEl.textContent = "View model not found";
          return;
        }

        const vmi = viewModel.defaultInstance() || viewModel.instance();

        riveAnimation.bindViewModelInstance(vmi);

        startTrigger = vmi.trigger(START_TRIGGER);

        if (!startTrigger) {
          console.error(`${START_TRIGGER} not found on ${VIEW_MODEL}`);
        }

        startButton.disabled = !startTrigger;
        statusEl.textContent = "";

        resizeRive();

        // Device-mode viewport changes can land right after load
        requestAnimationFrame(resizeRive);
        setTimeout(resizeRive, 100);

      },

      onLoadError: (err) => {
        console.error("RIVE LOAD ERROR:", err);
        statusEl.textContent = "Failed to load elevator";
      }

    });


    // =====================================================
    // START
    // =====================================================

    startButton.addEventListener("click", () => {

      if (!startTrigger) {
        return;
      }

      startTrigger.trigger();
      console.log(`${START_TRIGGER} fired`);

      overlay.classList.add("hidden");

    });


    // =====================================================
    // RESIZE
    // =====================================================

    function resizeRive() {
      riveAnimation.resizeDrawingSurfaceToCanvas();
    }

    window.addEventListener("resize", resizeRive);

    new ResizeObserver(resizeRive).observe(canvas);

    window.addEventListener("orientationchange", () => {
      setTimeout(resizeRive, 100);
    });

  </script>

</body>
</html>
