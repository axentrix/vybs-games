<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Scratch Game</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      background: #111;
      font-family: Arial, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }


    /* =====================================================
       RIVE GAME
    ===================================================== */

    .stage {
      position: fixed;

      top: 0;
      right: 0;
      bottom: 0;
      left: 0;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;
display:flex;
justify-content:center;
      background: #111;
    }


    #riveCanvas {
     
      top: 0;
      left: 0;

      width: 100%;
      max-width:360px !important;
      height: 100%;
      max-height:500px !important;

     

      display: block;

      touch-action: none;
    }


    /* =====================================================
       GAME SELECTION SCREEN
    ===================================================== */

    .game-select {
      position: fixed;
      inset: 0;

      z-index: 5000;

      width: 100%;
      height: 100%;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding:
        max(24px, env(safe-area-inset-top))
        20px
        max(24px, env(safe-area-inset-bottom));

      gap: 32px;

      overflow-y: auto;

      color: white;

      background:
        radial-gradient(
          circle at center,
          #292929 0%,
          #101010 75%
        );
    }


    .game-select.hidden {
      display: none;
    }


    .game-select h1 {
      flex-shrink: 0;

      font-size: clamp(26px, 6vw, 38px);
      line-height: 1.1;
      text-align: center;
    }


    .tier-list {
      width: min(760px, 100%);

      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 16px;
    }


    .tier-card {
      min-width: 0;
      min-height: 220px;

      padding: 22px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;

      gap: 16px;

      border-radius: 24px;

      background: rgba(255, 255, 255, 0.08);

      border:
        1px solid
        rgba(255, 255, 255, 0.13);

      backdrop-filter: blur(14px);
    }


    .tier-name {
      font-size: 22px;
      font-weight: 700;
    }


    .tier-description {
      flex: 1;

      display: flex;
      align-items: center;

      color: rgba(255, 255, 255, 0.6);

      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }


    .tier-button {
      width: 100%;
      min-height: 48px;

      padding: 12px 18px;

      border: 0;
      border-radius: 999px;

      background: white;
      color: #111;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
    }


    /* =====================================================
       BOTTOM GAME BUTTONS
    ===================================================== */

    .controls {
      position: fixed !important;

      left: 50% !important;

      bottom:
        max(
          16px,
          env(safe-area-inset-bottom)
        ) !important;

      transform:
        translateX(-50%) !important;

      z-index: 99999 !important;

      width:
        min(
          520px,
          calc(100vw - 24px)
        );

      display: none;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      pointer-events: auto;
    }


    .controls.visible {
      display: grid !important;
    }


    .controls button {
      width: 100%;
      min-width: 0;
      min-height: 52px;

      padding: 12px 10px;

      border: 0;
      border-radius: 999px;

      background: white;
      color: #111;

      font-size: 15px;
      font-weight: 700;

      white-space: nowrap;

      cursor: pointer;

      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.25);
    }


    /* =====================================================
       STATUS
    ===================================================== */

    .status {
      position: fixed;

      top:
        max(
          12px,
          env(safe-area-inset-top)
        );

      left: 50%;

      transform: translateX(-50%);

      z-index: 100000;

      padding: 8px 12px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.5);
      color: white;

      font-size: 12px;

      display: none;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {

      .game-select {
        justify-content: flex-start;

        padding-top:
          max(
            42px,
            env(safe-area-inset-top)
          );
      }


      .tier-list {
        width: min(360px, 100%);

        grid-template-columns: 1fr;

        gap: 12px;
      }


      .tier-card {
        width: 100%;
        min-height: 116px;

        display: grid;

        grid-template-columns:
          minmax(0, 1fr)
          82px;

        grid-template-rows:
          auto
          auto;

        align-items: center;

        gap: 5px 16px;

        padding: 18px;
      }


      .tier-name {
        grid-column: 1;
        grid-row: 1;

        text-align: left;
      }


      .tier-description {
        grid-column: 1;
        grid-row: 2;

        display: block;

        text-align: left;
      }


      .tier-button {
        grid-column: 2;
        grid-row: 1 / 3;

        width: 82px;
      }


      .controls {
        width:
          calc(
            100vw - 20px
          );

        bottom:
          max(
            10px,
            env(safe-area-inset-bottom)
          ) !important;
      }

    }


    /* =====================================================
       VERY SMALL PHONES
    ===================================================== */

    @media (max-width: 350px) {

      .controls {
        gap: 6px;
      }

      .controls button {
        font-size: 12px;
        min-height: 46px;
      }

    }


    /* =====================================================
       SHORT LANDSCAPE SCREENS
    ===================================================== */

    @media (max-height: 550px) {

      .game-select {
        justify-content: flex-start;
        padding-top: 16px;
      }

      .tier-list {
        grid-template-columns: repeat(3, 1fr);
        max-width: 700px;
      }

      .tier-card {
        min-height: 150px;
      }

    }
  </style>
</head>


<body>


  <!-- =====================================================
       SELECT GAME
  ====================================================== -->

  <div
    class="game-select"
    id="gameSelect"
  >

    <h1>Select your game:</h1>


    <div class="tier-list">


      <div class="tier-card">

        <div class="tier-name">
          Starter
        </div>

        <div class="tier-description">
          Start scratching and reveal your reward.
        </div>

        <button
          class="tier-button"
          data-tier="Starter"
        >
          $1
        </button>

      </div>



      <div class="tier-card">

        <div class="tier-name">
          Booster
        </div>

        <div class="tier-description">
          Boost your game with bigger possibilities.
        </div>

        <button
          class="tier-button"
          data-tier="Booster"
        >
          $2
        </button>

      </div>



      <div class="tier-card">

        <div class="tier-name">
          Pro
        </div>

        <div class="tier-description">
          Go all in with the Pro game.
        </div>

        <button
          class="tier-button"
          data-tier="Pro"
        >
          $5
        </button>

      </div>


    </div>

  </div>



  <!-- =====================================================
       GAME
  ====================================================== -->

  <main
    class="stage"
    id="stage"
  >

    <canvas
      id="riveCanvas"
    ></canvas>


    <div
      class="controls"
      id="controls"
    >

      <button
        id="autoScratchBtn"
      >
        Autoscratch
      </button>

      <button
        id="playAgainBtn"
      >
        Play Again
      </button>

    </div>


    <div
      class="status"
      id="status"
    >
      Loading…
    </div>

  </main>



  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>


  <script>

    const canvas =
      document.getElementById(
        "riveCanvas"
      );

    const gameSelect =
      document.getElementById(
        "gameSelect"
      );

    const controls =
      document.getElementById(
        "controls"
      );

    const autoScratchBtn =
      document.getElementById(
        "autoScratchBtn"
      );

    const playAgainBtn =
      document.getElementById(
        "playAgainBtn"
      );

    const statusEl =
      document.getElementById(
        "status"
      );

    const tierButtons =
      document.querySelectorAll(
        ".tier-button"
      );


    let riveAnimation = null;

    let scratchVM = null;

    let selectedSymbol = null;

    let autoScratchTrigger = null;

    let selectedTier = null;

    let symbolWatcher = null;

    let lastSymbolValue = null;



    // =====================================================
    // SELECT TIER
    // =====================================================

    tierButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            selectedTier =
              button.dataset.tier;

            gameSelect.classList.add(
              "hidden"
            );

            startGame(
              selectedTier
            );

          }
        );

      }
    );



    // =====================================================
    // START GAME
    // =====================================================

    function startGame(tier) {

      controls.classList.remove(
        "visible"
      );

      statusEl.style.display =
        "block";

      statusEl.textContent =
        "Loading game…";


      riveAnimation =
        new rive.Rive({

          src:
            "./scratch_vybs.riv",

          canvas:
            canvas,

          autoplay:
            true,

          artboard:
            "Artboard",

          stateMachine:
            "State Machine 1",

          autoBind:
            true,


          layout:
            new rive.Layout({

              fit:
                rive.Fit.Cover,

              alignment:
                rive.Alignment.Center

            }),


          onLoad: () => {

            resizeRive();


            // =============================================
            // ScratchVM
            // =============================================

            scratchVM =
              riveAnimation
                .viewModelInstance;


            if (!scratchVM) {

              console.error(
                "ScratchVM not bound"
              );

              return;
            }


            // =============================================
            // cardTier
            // =============================================

            const cardTier =
              scratchVM.string(
                "cardTier"
              );


            if (!cardTier) {

              console.error(
                "cardTier not found"
              );

            } else {

              cardTier.value =
                tier;

              console.log(
                "cardTier:",
                cardTier.value
              );

            }


            // =============================================
            // selectedSymbol
            // =============================================

            selectedSymbol =
              scratchVM.number(
                "selectedSymbol"
              );


            if (!selectedSymbol) {

              console.error(
                "selectedSymbol not found"
              );

            } else {

              startSymbolWatcher();

            }


            // =============================================
            // Autoscratch trigger
            // =============================================

            autoScratchTrigger =
              scratchVM.trigger(
                "autoScratchTrigger"
              );


            if (!autoScratchTrigger) {

              console.error(
                "autoScratchTrigger not found"
              );

            }


            statusEl.style.display =
              "none";


            /*
              Chrome's responsive device mode can
              change the viewport again immediately
              after Rive loads.
            */

            requestAnimationFrame(
              resizeRive
            );


            setTimeout(
              resizeRive,
              100
            );

          },


          onLoadError: error => {

            console.error(
              "RIVE LOAD ERROR:",
              error
            );

            statusEl.textContent =
              "Could not load game.";

          }

        });

    }



    // =====================================================
    // SILENT selectedSymbol WATCHER
    //
    // No console spam.
    // Only changes the controls when the value changes.
    // =====================================================

    function startSymbolWatcher() {

      stopSymbolWatcher();


      lastSymbolValue =
        Number(
          selectedSymbol.value
        );


      setControlsVisibility(
        lastSymbolValue
      );


      symbolWatcher =
        window.setInterval(
          () => {

            if (!selectedSymbol) {
              return;
            }


            const value =
              Number(
                selectedSymbol.value
              );


            if (
              value ===
              lastSymbolValue
            ) {
              return;
            }


            lastSymbolValue =
              value;


            setControlsVisibility(
              value
            );

          },
          100
        );

    }



    function stopSymbolWatcher() {

      if (symbolWatcher !== null) {

        clearInterval(
          symbolWatcher
        );

        symbolWatcher = null;

      }

    }



    function setControlsVisibility(
      value
    ) {

      if (value > 0) {

        controls.classList.add(
          "visible"
        );

      } else {

        controls.classList.remove(
          "visible"
        );

      }

    }



    // =====================================================
    // AUTOSCRATCH
    // =====================================================

    autoScratchBtn.addEventListener(
      "click",
      () => {

        if (!autoScratchTrigger) {

          console.error(
            "autoScratchTrigger unavailable"
          );

          return;
        }


        autoScratchTrigger.trigger();

      }
    );



    // =====================================================
    // PLAY AGAIN
    // =====================================================

    playAgainBtn.addEventListener(
      "click",
      () => {

        controls.classList.remove(
          "visible"
        );


        stopSymbolWatcher();


        if (riveAnimation) {

          riveAnimation.cleanup();

        }


        riveAnimation =
          null;

        scratchVM =
          null;

        selectedSymbol =
          null;

        autoScratchTrigger =
          null;

        selectedTier =
          null;

        lastSymbolValue =
          null;


        const ctx =
          canvas.getContext(
            "2d"
          );


        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        gameSelect.classList.remove(
          "hidden"
        );

      }
    );



    // =====================================================
    // RESIZE
    // =====================================================

    function resizeRive() {

      if (!riveAnimation) {
        return;
      }


      riveAnimation
        .resizeDrawingSurfaceToCanvas();

    }


    window.addEventListener(
      "resize",
      resizeRive
    );


    window.addEventListener(
      "orientationchange",
      () => {

        setTimeout(
          resizeRive,
          100
        );

      }
    );


    /*
      Also catches Chrome responsive-device resizing,
      container resizing, etc.
    */

    const resizeObserver =
      new ResizeObserver(
        () => {

          resizeRive();

        }
      );


    resizeObserver.observe(
      document.documentElement
    );

  </script>

</body>

</html>
