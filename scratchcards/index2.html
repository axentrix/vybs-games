<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Scratch Game</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      background: #121642;
      font-family: Arial, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }


    /* =====================================================
       RIVE GAME
    ===================================================== */

    .stage {
      position: fixed;

      top: 0;
      right: 0;
      bottom: 0;
      left: 0;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;
display:flex;
justify-content:center;
      background: #121642;
    }


    #riveCanvas {
     
      top: 0;
      left: 0;

      width: 100%;
      max-width:360px !important;
      height: 100%;
      max-height:500px !important;

     

      display: block;

      touch-action: none;
    }


    /* =====================================================
       TICKET PURCHASE SCREEN
    ===================================================== */

    .game-select {
      position: fixed;
      inset: 0;

      z-index: 5000;

      width: 100%;
      height: 100%;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;

      overflow-y: auto;

      color: #fff;

      background: #121642;

      font-family: "Kanit", Arial, sans-serif;
    }


    .game-select.hidden {
      display: none;
    }


    /* ---- top bar ---- */

    .ps-topbar {
      width: 100%;
      max-width: 420px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      padding: max(16px, env(safe-area-inset-top)) 16px 0;
    }


    .ps-icon-btn {
      flex-shrink: 0;

      width: 28px;
      height: 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 999px;

      background: rgba(0, 0, 0, 0.24);
      color: #fff;

      font-family: inherit;
      font-size: 14px;
      line-height: 1;

      cursor: pointer;
    }


    .ps-icon-btn.plain {
      background: transparent;
    }


    .ps-balances {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }


    .ps-chip {
      display: flex;
      align-items: center;
      gap: 4px;

      height: 32px;
      padding: 0 8px;

      border-radius: 12px;

      background: rgba(18, 22, 66, 0.44);

      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.03em;
    }


    .ps-chip-ico {
      font-size: 15px;
    }


    .ps-chip.cash    { color: #d6ff8c; }
    .ps-chip.tickets { color: #fbe94b; }


    /* ---- header ---- */

    .ps-head {
      width: 100%;
      max-width: 360px;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;

      padding: 20px 24px 0;

      text-align: center;
    }


    .ps-logo {
      font-weight: 600;
      font-size: clamp(28px, 9vw, 34px);
      line-height: 1.2;

      color: #feffe5;

      text-shadow:
        0 2px 0 #161c7b,
        0 0.5px 0 #6e78ff;
    }


    .ps-subtitle {
      font-weight: 600;
      font-size: 24px;

      color: #f5f4f4;
    }


    /* ---- card row ---- */

    .tier-list {
      width: 100%;
      max-width: 360px;

      display: flex;
      gap: 12px;
      align-items: center;

      /* side padding lets the first / last card settle in the centre */
      padding: 20px max(24px, calc(50% - 90px));

      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }


    .tier-list::-webkit-scrollbar {
      display: none;
    }


    .tier-card {
      position: relative;
      isolation: isolate;

      width: 180px;
      min-width: 180px;
      height: 264px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;

      padding-top: 12px;

      border: 2px solid #fff;
      border-radius: 12px;

      overflow: hidden;
      scroll-snap-align: center;

      transform: scale(0.84);
      opacity: 0.5;

      transition:
        transform 0.28s ease,
        opacity 0.28s ease;

      will-change: transform;
    }


    .tier-card.is-active {
      transform: scale(1.04);
      opacity: 1;

      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }


    @media (prefers-reduced-motion: reduce) {
      .tier-card { transition: none; }
    }


    .tier-card.starter { background: linear-gradient(180deg, #9cfef2 0%, #76de99 100%); }
    .tier-card.booster { background: #ac4bff; }
    .tier-card.pro     { background: linear-gradient(180deg, #ffb835 0%, #ff7441 100%); }


    /* decorative dot pattern */
    .tier-card::before {
      content: "";

      position: absolute;
      inset: -20px;
      z-index: -1;

      background-image:
        radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0.55) 0 6px,
          transparent 7px
        );
      background-size: 46px 46px;

      opacity: 0.18;
    }


    .tier-card.booster::before { opacity: 0.14; }
    .tier-card.pro::before     { opacity: 0.13; }


    .tier-body {
      flex: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;

      padding: 0 10px;

      text-align: center;
    }


    .tier-name {
      font-weight: 700;
      font-size: 24px;
      line-height: 1;

      color: #fff;

      text-shadow: 0 2px 0 #ae4fb4;
    }


    .tier-description {
      font-weight: 400;
      font-size: 12px;
      line-height: 14px;

      color: rgba(18, 22, 66, 0.77);
    }


    .tier-prize {
      display: flex;
      align-items: center;
      gap: 4px;

      margin-top: 6px;

      font-weight: 800;
      font-size: 20px;

      color: #fff;

      text-shadow: 0.875px 1.75px 0 #0d2b02;
    }


    .tier-prize-ico {
      font-size: 20px;
    }


    .tier-foot {
      width: 100%;

      padding: 12px;

      background: #fff;
    }


    .tier-button {
      position: relative;

      width: 100%;
      min-height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 6px 16px 10px;

      border: 0;
      border-radius: 8px;

      background: #5e69ff;
      color: #fff;

      box-shadow: inset 0 -6px 0 0 #4854eb;

      font-family: inherit;
      font-weight: 400;
      font-size: 14px;

      cursor: pointer;
    }


    .tier-price {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.025em;
    }


    /* ---- bottom links ---- */

    .ps-odds {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;

      padding: 16px 24px max(24px, env(safe-area-inset-bottom));

      font-weight: 400;
      font-size: 12px;
      line-height: 14px;

      color: #fff;
      text-align: center;
    }


    .ps-odds a {
      color: #fff;
      text-decoration: none;
    }


    /* =====================================================
       BOTTOM GAME BUTTONS
    ===================================================== */

    .controls {
      position: fixed !important;

      left: 50% !important;

      bottom:
        max(
          16px,
          env(safe-area-inset-bottom)
        ) !important;

      transform:
        translateX(-50%) !important;

      z-index: 99999 !important;

      width:
        min(
          520px,
          calc(100vw - 24px)
        );

      display: none;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      pointer-events: auto;
    }


    .controls.visible {
      display: grid !important;
    }


    .controls button {
      width: 100%;
      min-width: 0;
      min-height: 52px;

      padding: 12px 10px;

      border: 0;
      border-radius: 999px;

      background: white;
      color: #111;

      font-size: 15px;
      font-weight: 700;

      white-space: nowrap;

      cursor: pointer;

      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.25);
    }


    /* =====================================================
       STATUS
    ===================================================== */

    .status {
      position: fixed;

      top:
        max(
          12px,
          env(safe-area-inset-top)
        );

      left: 50%;

      transform: translateX(-50%);

      z-index: 100000;

      padding: 8px 12px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.5);
      color: white;

      font-size: 12px;

      display: none;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {

      .controls {
        width:
          calc(
            100vw - 20px
          );

        bottom:
          max(
            10px,
            env(safe-area-inset-bottom)
          ) !important;
      }

    }


    /* =====================================================
       VERY SMALL PHONES
    ===================================================== */

    @media (max-width: 350px) {

      .controls {
        gap: 6px;
      }

      .controls button {
        font-size: 12px;
        min-height: 46px;
      }

    }


    /* =====================================================
       SHORT LANDSCAPE SCREENS
    ===================================================== */

    @media (max-height: 550px) {

      .ps-head {
        gap: 12px;
        padding-top: 12px;
      }

    }
  </style>
</head>


<body>


  <!-- =====================================================
       SELECT GAME
  ====================================================== -->

  <div
    class="game-select"
    id="gameSelect"
  >

    <div class="ps-topbar">

      <button
        class="ps-icon-btn"
        type="button"
        aria-label="Help"
      >?</button>

      <div class="ps-balances">

        <span class="ps-chip cash">
          <span class="ps-chip-ico">💵</span>25.05
        </span>

        <span class="ps-chip tickets">
          <span class="ps-chip-ico">🎟️</span>3
        </span>

      </div>

      <button
        class="ps-icon-btn plain"
        type="button"
        aria-label="Close"
      >✕</button>

    </div>


    <div class="ps-head">
      <div class="ps-logo">Scratch‘n’Win</div>
      <div class="ps-subtitle">Purchase Tickets</div>
    </div>


    <div class="tier-list" id="tierList">


      <div class="tier-card starter">

        <div class="tier-body">
          <div class="tier-name">Starter</div>
          <div class="tier-description">Scratch to win up to</div>
          <div class="tier-prize">
            <span class="tier-prize-ico">💵</span>$10
          </div>
        </div>

        <div class="tier-foot">
          <button
            class="tier-button"
            data-tier="Starter"
          >
            Scratch for <span class="tier-price">$1.00</span>
          </button>
        </div>

      </div>



      <div class="tier-card booster">

        <div class="tier-body">
          <div class="tier-name">Booster</div>
          <div class="tier-description">Scratch to win up to</div>
          <div class="tier-prize">
            <span class="tier-prize-ico">💵</span>$300
          </div>
        </div>

        <div class="tier-foot">
          <button
            class="tier-button"
            data-tier="Booster"
          >
            Scratch for <span class="tier-price">$2.00</span>
          </button>
        </div>

      </div>



      <div class="tier-card pro">

        <div class="tier-body">
          <div class="tier-name">Pro</div>
          <div class="tier-description">Scratch to win up to</div>
          <div class="tier-prize">
            <span class="tier-prize-ico">💵</span>$1,000
          </div>
        </div>

        <div class="tier-foot">
          <button
            class="tier-button"
            data-tier="Pro"
          >
            Scratch for <span class="tier-price">$5.00</span>
          </button>
        </div>

      </div>


    </div>


    <div class="ps-odds">
      <span>Odds 4 in 1</span>
      <a href="#">View Prize table</a>
    </div>

  </div>



  <!-- =====================================================
       GAME
  ====================================================== -->

  <main
    class="stage"
    id="stage"
  >

    <canvas
      id="riveCanvas"
    ></canvas>


    <div
      class="controls"
      id="controls"
    >

      <button
        id="autoScratchBtn"
      >
        Autoscratch
      </button>

      <button
        id="playAgainBtn"
      >
        Play Again
      </button>

    </div>


    <div
      class="status"
      id="status"
    >
      Loading…
    </div>

  </main>



  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>


  <script>

    const canvas =
      document.getElementById(
        "riveCanvas"
      );

    const gameSelect =
      document.getElementById(
        "gameSelect"
      );

    const controls =
      document.getElementById(
        "controls"
      );

    const autoScratchBtn =
      document.getElementById(
        "autoScratchBtn"
      );

    const playAgainBtn =
      document.getElementById(
        "playAgainBtn"
      );

    const statusEl =
      document.getElementById(
        "status"
      );

    const tierButtons =
      document.querySelectorAll(
        ".tier-button"
      );


    let riveAnimation = null;

    let scratchVM = null;

    let selectedSymbol = null;

    let autoScratchTrigger = null;

    let selectedTier = null;

    let isStarter = null;
    let isBooster = null;
    let isPro = null;

    let symbolWatcher = null;

    let lastSymbolValue = null;



    // =====================================================
    // TIER CAROUSEL
    //
    // The three cards scroll horizontally. The card closest
    // to the centre of the track is the "active" one and is
    // scaled up. Tapping a side card centres it first; the
    // second tap on the active card's button starts the game.
    // =====================================================

    const tierList =
      document.getElementById(
        "tierList"
      );

    const tierCards =
      Array.from(
        document.querySelectorAll(
          ".tier-card"
        )
      );

    let activeCard = null;

    let carouselRaf = null;


    function updateActiveCard() {

      carouselRaf = null;

      if (!tierList) {
        return;
      }

      const listRect =
        tierList.getBoundingClientRect();

      const center =
        listRect.left +
        listRect.width / 2;


      let closest = null;
      let closestDist = Infinity;


      tierCards.forEach(card => {

        const rect =
          card.getBoundingClientRect();

        const cardCenter =
          rect.left + rect.width / 2;

        const dist =
          Math.abs(cardCenter - center);


        if (dist < closestDist) {
          closestDist = dist;
          closest = card;
        }

      });


      if (closest === activeCard) {
        return;
      }


      tierCards.forEach(card => {

        card.classList.toggle(
          "is-active",
          card === closest
        );

      });


      activeCard = closest;

    }


    function queueUpdateActiveCard() {

      if (carouselRaf !== null) {
        return;
      }

      carouselRaf =
        requestAnimationFrame(
          updateActiveCard
        );

    }


    function centerCard(card, behavior) {

      if (!card) {
        return;
      }

      const target =
        card.offsetLeft +
        card.offsetWidth / 2 -
        tierList.clientWidth / 2;


      tierList.scrollTo({
        left: target,
        behavior: behavior || "smooth"
      });

    }


    if (tierList) {

      tierList.addEventListener(
        "scroll",
        queueUpdateActiveCard,
        { passive: true }
      );

      window.addEventListener(
        "resize",
        queueUpdateActiveCard
      );


      // Centre a card when it (or anything inside it) is
      // tapped while it is not the active card.

      tierList.addEventListener(
        "click",
        event => {

          const card =
            event.target.closest(
              ".tier-card"
            );

          if (!card) {
            return;
          }

          if (card !== activeCard) {

            event.preventDefault();
            event.stopPropagation();

            centerCard(card);

          }

        },
        true
      );


      // Start on the middle card.

      requestAnimationFrame(() => {

        centerCard(
          tierCards[
            Math.floor(
              tierCards.length / 2
            )
          ],
          "auto"
        );

        updateActiveCard();

      });

    }



    // =====================================================
    // SELECT TIER
    // =====================================================

    tierButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            selectedTier =
              button.dataset.tier;

            gameSelect.classList.add(
              "hidden"
            );

            startGame(
              selectedTier
            );

          }
        );

      }
    );



    // =====================================================
    // APPLY CARD TIER TO RIVE
    //
    // We set BOTH the string and the three booleans from
    // JavaScript. This makes the browser runtime use the
    // same tier state that works inside Rive.
    // =====================================================

    function applyCardTier(tier) {

      if (!scratchVM) {
        return;
      }

      const cardTier =
        scratchVM.string(
          "cardTier"
        );

      isStarter =
        scratchVM.boolean(
          "isStarter"
        );

      isBooster =
        scratchVM.boolean(
          "isBooster"
        );

      isPro =
        scratchVM.boolean(
          "isPro"
        );


      if (cardTier) {
        cardTier.value =
          tier;
      }


      if (isStarter) {
        isStarter.value =
          tier === "Starter";
      }


      if (isBooster) {
        isBooster.value =
          tier === "Booster";
      }


      if (isPro) {
        isPro.value =
          tier === "Pro";
      }


      console.log(
        "CARD TIER FROM HTML:",
        tier,
        {
          cardTier:
            cardTier
              ? cardTier.value
              : null,

          isStarter:
            isStarter
              ? isStarter.value
              : null,

          isBooster:
            isBooster
              ? isBooster.value
              : null,

          isPro:
            isPro
              ? isPro.value
              : null
        }
      );

    }



    // =====================================================
    // START GAME
    // =====================================================

    function startGame(tier) {

      controls.classList.remove(
        "visible"
      );

      statusEl.style.display =
        "block";

      statusEl.textContent =
        "Loading game…";


      riveAnimation =
        new rive.Rive({

          src:
            "./scratch_vybs.riv",

          canvas:
            canvas,

          autoplay:
            true,

          artboard:
            "Artboard",

          stateMachine:
            "State Machine 1",

          autoBind:
            true,


          layout:
            new rive.Layout({

              fit:
                rive.Fit.Cover,

              alignment:
                rive.Alignment.Center

            }),


          onLoad: () => {

            resizeRive();


            // =============================================
            // ScratchVM
            // =============================================

            scratchVM =
              riveAnimation
                .viewModelInstance;


            if (!scratchVM) {

              console.error(
                "ScratchVM not bound"
              );

              return;
            }


            // =============================================
            // CARD TIER + TIER BOOLEANS
            // =============================================

            applyCardTier(
              tier
            );


            // =============================================
            // selectedSymbol
            // =============================================

            selectedSymbol =
              scratchVM.number(
                "selectedSymbol"
              );


            if (!selectedSymbol) {

              console.error(
                "selectedSymbol not found"
              );

            } else {

              startSymbolWatcher();

            }


            // =============================================
            // Autoscratch trigger
            // =============================================

            autoScratchTrigger =
              scratchVM.trigger(
                "autoScratchTrigger"
              );


            if (!autoScratchTrigger) {

              console.error(
                "autoScratchTrigger not found"
              );

            }


            statusEl.style.display =
              "none";


            /*
              Chrome's responsive device mode can
              change the viewport again immediately
              after Rive loads.
            */

            requestAnimationFrame(
              resizeRive
            );


            setTimeout(
              resizeRive,
              100
            );

          },


          onLoadError: error => {

            console.error(
              "RIVE LOAD ERROR:",
              error
            );

            statusEl.textContent =
              "Could not load game.";

          }

        });

    }



    // =====================================================
    // SILENT selectedSymbol WATCHER
    //
    // No console spam.
    // Only changes the controls when the value changes.
    // =====================================================

    function startSymbolWatcher() {

      stopSymbolWatcher();


      lastSymbolValue =
        Number(
          selectedSymbol.value
        );


      setControlsVisibility(
        lastSymbolValue
      );


      symbolWatcher =
        window.setInterval(
          () => {

            if (!selectedSymbol) {
              return;
            }


            const value =
              Number(
                selectedSymbol.value
              );


            if (
              value ===
              lastSymbolValue
            ) {
              return;
            }


            lastSymbolValue =
              value;


            setControlsVisibility(
              value
            );

          },
          100
        );

    }



    function stopSymbolWatcher() {

      if (symbolWatcher !== null) {

        clearInterval(
          symbolWatcher
        );

        symbolWatcher = null;

      }

    }



    function setControlsVisibility(
      value
    ) {

      if (value > 0) {

        controls.classList.add(
          "visible"
        );

      } else {

        controls.classList.remove(
          "visible"
        );

      }

    }



    // =====================================================
    // AUTOSCRATCH
    // =====================================================

    autoScratchBtn.addEventListener(
      "click",
      () => {

        if (!autoScratchTrigger) {

          console.error(
            "autoScratchTrigger unavailable"
          );

          return;
        }


        autoScratchTrigger.trigger();

      }
    );



    // =====================================================
    // PLAY AGAIN
    // =====================================================

    playAgainBtn.addEventListener(
      "click",
      () => {

        controls.classList.remove(
          "visible"
        );


        stopSymbolWatcher();


        if (riveAnimation) {

          riveAnimation.cleanup();

        }


        riveAnimation =
          null;

        scratchVM =
          null;

        selectedSymbol =
          null;

        autoScratchTrigger =
          null;

        selectedTier =
          null;

        isStarter =
          null;

        isBooster =
          null;

        isPro =
          null;

        lastSymbolValue =
          null;


        const ctx =
          canvas.getContext(
            "2d"
          );


        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        gameSelect.classList.remove(
          "hidden"
        );

      }
    );



    // =====================================================
    // RESIZE
    // =====================================================

    function resizeRive() {

      if (!riveAnimation) {
        return;
      }


      riveAnimation
        .resizeDrawingSurfaceToCanvas();

    }


    window.addEventListener(
      "resize",
      resizeRive
    );


    window.addEventListener(
      "orientationchange",
      () => {

        setTimeout(
          resizeRive,
          100
        );

      }
    );


    /*
      Also catches Chrome responsive-device resizing,
      container resizing, etc.
    */

    const resizeObserver =
      new ResizeObserver(
        () => {

          resizeRive();

        }
      );


    resizeObserver.observe(
      document.documentElement
    );

  </script>

</body>
