<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --popup-bg: #3d47d0;
      --panel-bg: #ececfb;
      --tile-bg: #d3d3ff;
      --button-bg: #abb1ff;
      --outline: #282d71;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0b0a1a;
      font-family: "Kanit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img { display: block; max-width: none; }

    /* =====================================================
       SCREEN
       ===================================================== */

    /* Desktop: fixed phone-sized frame */
    .screen {
      position: relative;
      width: 100%;
      max-width: 393px;
      height: 852px;
      max-height: 100dvh;
      border-radius: 28px;
      overflow: hidden;
      background: #f2f2f7 url("./main.png") top center / cover no-repeat;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    /* Mobile: edge to edge, full screen */
    @media (max-width: 480px) {
      .screen {
        height: 100vh;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* =====================================================
       OVERLAY
       ===================================================== */

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 0;
      background: rgba(5, 4, 18, 0.6);
      transition: opacity 0.25s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Holds the popup at its scaled size so layout around it stays correct */
    .popup-slot {
      position: relative;
      flex: 0 0 auto;
    }

    /* =====================================================
       POPUP (Figma 8009:62585, 360 wide; shortened to a bottom sheet)
       ===================================================== */

    .popup {
      position: absolute;
      top: 0;
      left: 0;
      width: 360px;
      height: 650px;
      transform-origin: top left;
      background: var(--popup-bg);
      border-radius: 12px 12px 0 0;
      overflow: hidden;
    }

    #riveCanvas {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .status {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      text-align: center;
      color: #fff;
      font-size: 14px;
      pointer-events: none;
    }

    .abs { position: absolute; }
    .fill { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* ---------- Header logo ---------- */

    .logo {
      position: absolute;
      left: 50%;
      top: 13px;
      width: 160px;
      height: auto;
      transform: translateX(-50%);
    }

    /* ---------- Corner buttons ---------- */

    .close-button {
      position: absolute;
      left: 309px;
      top: 11px;
      z-index: 2;
      display: flex;
      padding: 4px;
      border: none;
      border-radius: 999px;
      background: rgba(40, 45, 113, 0.64);
      cursor: pointer;
    }

    .close-button .icon {
      position: relative;
      width: 20px;
      height: 20px;
      overflow: hidden;
    }

    .close-button .icon > div {
      position: absolute;
      inset: 34.86%;
    }

    .close-button img {
      position: absolute;
      inset: -8.25%;
      width: 116.5%;
      height: 116.5%;
    }

    .help-button {
      position: absolute;
      left: 9.5px;
      top: 13px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 23px;
      height: 24px;
      padding: 6px 8px;
      border: none;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.12);
    }

    .help-button img {
      width: 4.892px;
      height: 7.338px;
    }

    /* ---------- Rewards panel ---------- */

    .rewards {
      position: absolute;
      left: calc(50% - 0.34px);
      bottom: 16px;
      width: 312px;
      transform: translateX(-50%);
    }

    .rewards-tab {
      position: absolute;
      left: 50%;
      top: -12.63px;
      width: 126.842px;
      height: 21.363px;
      transform: translateX(-50%);
      border-radius: 12px;
      background: var(--panel-bg);
    }

    .rewards-title {
      position: absolute;
      left: 50%;
      top: -1.94px;
      width: 90px;
      transform: translate(-50%, -50%);
      text-align: center;
      font-weight: 600;
      font-size: 12.621px;
      line-height: 11.683px;
      letter-spacing: 0.3786px;
      white-space: nowrap;
      color: #eeefff;
    }

    .panel {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 156px;
      padding: 9.536px;
      border-radius: 14.304px;
      background: var(--panel-bg);
      overflow: hidden;
    }

    /* Navy outline around white text, as in the design */
    .outlined {
      color: #fff;
      -webkit-text-stroke: 3px var(--outline);
      paint-order: stroke fill;
    }

    .tiles {
      display: flex;
      gap: 4.768px;
      width: 100%;
    }

    .tile {
      flex: 1 0 0;
      min-width: 1px;
      height: 79px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-radius: 7.014px;
      background: var(--tile-bg);
      overflow: hidden;
    }

    .tile.wheel-tile { padding-bottom: 12px; }

    .tile-head {
      width: 100%;
      height: 21.043px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3.507px 0;
      font-weight: 700;
      font-size: 14.304px;
      line-height: 14.028px;
      text-align: center;
    }

    .reward-pill {
      height: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .reward-value {
      font-weight: 800;
      font-size: 16px;
      line-height: 16.688px;
      letter-spacing: -0.48px;
      white-space: nowrap;
      position: relative;
    }

    .cash-icon {
      width: 41px;
      height: 36.556px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: -6px;
    }

    .cash-icon img {
      width: 33.76px;
      height: 25.469px;
    }

    .token-box {
      width: 32.31px;
      height: 31.679px;
      margin-bottom: -4px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Puzzle piece */
    .puzzle {
      overflow: hidden;
    }

    .puzzle > div {
      position: absolute;
      left: 3.7px;
      top: 2.88px;
      width: 25.622px;
      height: 25.622px;
      transform: rotate(180deg);
    }

    .puzzle img {
      position: absolute;
      inset: -1.37% -1.37% -1.36% -1.36%;
      width: 102.73%;
      height: 102.73%;
    }

    /* Chip token */
    .chip {
      position: relative;
      width: 27.349px;
      height: 27.349px;
    }

    .chip .masked {
      position: absolute;
      -webkit-mask-image: url("./assets/chip-mask.svg");
      mask-image: url("./assets/chip-mask.svg");
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 306.83px 306.83px;
      mask-size: 306.83px 306.83px;
      mask-mode: alpha;
    }

    .chip .masked img,
    .chip .part img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .chip .part { position: absolute; }

    .chip .vip {
      position: absolute;
      left: 22.41%;
      right: 23.24%;
      top: 6.2px;
      aspect-ratio: 1;
      overflow: hidden;
    }

    /* Lucky wheel */
    .wheel {
      position: relative;
      width: 41.787px;
      height: 40.971px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
    }

    .wheel-golden {
      position: relative;
      width: 41.612px;
      height: 41.612px;
    }

    .wheel-stack {
      position: absolute;
      left: 0.43px;
      top: 0.27px;
      width: 40.748px;
      height: 41.071px;
    }

    .wheel-stack .p { position: absolute; }
    .wheel-stack .p > img { width: 100%; height: 100%; }

    .wheel-stack .c {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---------- Bottom buttons ---------- */

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 30px;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: var(--button-bg);
      color: #fff;
      font-family: inherit;
      font-weight: 500;
      font-size: 12px;
      line-height: 16px;
      letter-spacing: 0.4px;
      white-space: nowrap;
      cursor: pointer;
    }

    .action:active { transform: translateY(1px); }
    .action:disabled { opacity: 0.6; cursor: default; }
    .action.on { background: var(--popup-bg); }

    .balls-input {
      width: 2ch;
      padding: 0;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.7);
      background: transparent;
      color: #fff;
      font: inherit;
      text-align: center;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .balls-input::-webkit-outer-spin-button,
    .balls-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* =====================================================
       BINGO BUTTON (from index_buttons.html, fixed above the tab bar)
       ===================================================== */

    /* Dial centre sits where the minigames FAB does: 47.5px from the
       right edge, 111.5px from the bottom */
    .bingo-button {
      position: absolute;
      right: 15.7px;
      bottom: 72.55px;
      z-index: 1;
      width: 63.6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 6.2px;
      border: 0;
      background: none;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.08s;
    }

    .bingo-button:active { transform: scale(0.94); }

    .bingo-button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
      border-radius: 12px;
    }

    /* Dial layers, outside in: progress ring (5px), a hairline gap, the navy
       disc, then the icon with ~1.5px of navy padding around it. */
    .mg-dial {
      position: relative;
      width: 53.9px;
      height: 53.9px;
      margin-bottom: -2px;
    }

    .mg-dial img {
      position: absolute;
      inset: 7.25px;
      width: calc(100% - 14.5px);
      height: calc(100% - 14.5px);
      border-radius: 50%;
      object-fit: cover;
    }

    .mg-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .mg-ring .disc { fill: #121642; }

    .mg-ring path {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
    }

    .mg-ring .track { stroke: #fff; }

    .mg-ring .fill {
      stroke: #fed846;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
    }

    .mg-value {
      position: absolute;
      left: 50%;
      top: calc(50% + 7.3px);
      transform: translateX(-50%);
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      line-height: 10.861px;
      letter-spacing: 0.19px;
      text-shadow: 0 1px 0 #121642;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .mg-counter {
      position: relative;
      height: 14px;
      min-width: 29.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px 4px;
      border-radius: 888px;
      background: #5e69ff;
      color: #fff;
      font-weight: 500;
      font-size: 12px;
      line-height: 12.3px;
      white-space: nowrap;
    }
  </style>
</head>

  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>

  <script>

    // =====================================================
    // CONFIG
    // =====================================================

    const RIVE_SRC = "./bingo-vybs.riv";
    const VIEW_MODEL = "BingoVM";

    const POPUP_W = 360;
    const POPUP_H = 650;      // design height when there's room
    const POPUP_MIN_H = 480;  // below this, shrink the whole popup instead
    const POPUP_TOP_GAP = 40; // page left visible above the popup


    const canvas = document.getElementById("riveCanvas");
    const statusEl = document.getElementById("status");
    const overlay = document.getElementById("overlay");
    const popup = document.getElementById("popup");
    const popupSlot = document.getElementById("popupSlot");

    const ballsInput = document.getElementById("ballsToDrop");
    const dropButton = document.getElementById("dropBalls");
    const milestonesButton = document.getElementById("showMilestones");

    let props = {};


    // =====================================================
    // LOAD RIVE
    // =====================================================

    const riveAnimation = new rive.Rive({

      src: RIVE_SRC,
      canvas: canvas,
      // Default artboard; state machine is started in onLoad so the
      // artboard's first timeline doesn't also play
      autoplay: false,
      autoBind: false,

      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.Center
      }),

      onLoad: () => {

        const stateMachines = riveAnimation.stateMachineNames;
        console.log("State machines in artboard:", stateMachines);

        if (stateMachines.length) {
          riveAnimation.play(stateMachines[0]);
        }

        const viewModel = riveAnimation.viewModelByName(VIEW_MODEL);

        if (!viewModel) {
          console.error(`${VIEW_MODEL} not found`);
          statusEl.textContent = "View model not found";
          return;
        }

        const vmi = viewModel.defaultInstance() || viewModel.instance();

        riveAnimation.bindViewModelInstance(vmi);

        props = {
          ballsToDrop: vmi.number("ballsToDrop"),
          dropBalls: vmi.trigger("dropBalls"),
          showMilestones: vmi.boolean("showMilestones")
        };

        for (const [name, prop] of Object.entries(props)) {
          if (!prop) {
            console.error(`${name} not found on ${VIEW_MODEL}`);
          }
        }

        // Seed the ball count from the view model
        if (props.ballsToDrop) ballsInput.value = props.ballsToDrop.value;

        dropButton.disabled = !props.dropBalls;
        milestonesButton.disabled = !props.showMilestones;
        renderMilestones();

        statusEl.textContent = "";

        resizeRive();

        // Device-mode viewport changes can land right after load
        requestAnimationFrame(resizeRive);
        setTimeout(resizeRive, 100);

      },

      onLoadError: (err) => {
        console.error("RIVE LOAD ERROR:", err);
        statusEl.textContent = "Failed to load bingo";
      }

    });


    // =====================================================
    // CONTROLS
    // =====================================================

    function setBallsToDrop() {
      if (!props.ballsToDrop) return;
      props.ballsToDrop.value = Number(ballsInput.value) || 0;
    }

    ballsInput.addEventListener("input", setBallsToDrop);

    dropButton.addEventListener("click", () => {
      if (!props.dropBalls) return;
      setBallsToDrop();
      props.dropBalls.trigger();
      console.log(`dropBalls fired (ballsToDrop = ${props.ballsToDrop?.value})`);
    });

    milestonesButton.addEventListener("click", () => {
      if (!props.showMilestones) return;
      props.showMilestones.value = !props.showMilestones.value;
      renderMilestones();
    });

    function renderMilestones() {
      const on = !!props.showMilestones?.value;
      milestonesButton.classList.toggle("on", on);
      milestonesButton.textContent = on ? "Hide milestones" : "Show milestones";
    }

    // =====================================================
    // POPUP OPEN / CLOSE
    // =====================================================

    document.getElementById("closeButton").addEventListener("click", () => {
      overlay.classList.add("hidden");
    });

    document.getElementById("reopenButton").addEventListener("click", () => {
      overlay.classList.remove("hidden");
      requestAnimationFrame(resizeRive);
    });


    // =====================================================
    // RESIZE
    // =====================================================

    // Scale the popup to the screen width, pinned to the bottom. On short
    // browsers the popup gets shorter instead (the Rive area absorbs it), so
    // it always fits the visible height with some of the page showing above.
    function fitPopup() {
      const availW = overlay.clientWidth;
      const availH = overlay.clientHeight - POPUP_TOP_GAP;
      const scale = Math.min(availW / POPUP_W, availH / POPUP_MIN_H);
      const height = Math.min(POPUP_H, availH / scale);

      popup.style.transform = `scale(${scale})`;
      popup.style.height = `${height}px`;
      popupSlot.style.width = `${POPUP_W * scale}px`;
      popupSlot.style.height = `${height * scale}px`;
    }

    function resizeRive() {
      fitPopup();
      riveAnimation.resizeDrawingSurfaceToCanvas();
    }

    window.addEventListener("resize", resizeRive);

    new ResizeObserver(resizeRive).observe(overlay);

    window.addEventListener("orientationchange", () => {
      setTimeout(resizeRive, 100);
    });

    fitPopup();

  </script>

</body>
</html>
