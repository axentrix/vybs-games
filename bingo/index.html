<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --popup-bg: #3d47d0;
      --panel-bg: #ececfb;
      --tile-bg: #d3d3ff;
      --button-bg: #abb1ff;
      --outline: #282d71;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0b0a1a;
      font-family: "Kanit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img { display: block; max-width: none; }

    /* =====================================================
       SCREEN
       ===================================================== */

    /* Desktop: fixed phone-sized frame */
    .screen {
      position: relative;
      width: 100%;
      max-width: 393px;
      height: 852px;
      max-height: 100dvh;
      border-radius: 28px;
      overflow: hidden;
      background: #f2f2f7 url("./main.png") top center / cover no-repeat;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    /* Mobile: edge to edge, full screen */
    @media (max-width: 480px) {
      .screen {
        height: 100vh;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* =====================================================
       OVERLAY
       ===================================================== */

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: var(--popup-bg);
      transition: opacity 0.25s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ---------- Lottery drum intro (shown first, above the board) ---------- */

    .drum-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px 16px;
      background: #1a1e59;
      transition: opacity 0.25s ease;
    }

    .drum-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Height follows the artboard's aspect ratio (set on load), capped so
       the start button always fits below */
    #drumCanvas {
      flex: none;
      width: 100%;
      height: auto;
      max-height: calc(100% - 48px - 24px);
      display: block;
      touch-action: none;
    }

    .drum-controls {
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .drum-balls {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 48px;
      padding: 0 14px;
      border-radius: 12px;
      background: var(--popup-bg);
      color: #fff;
      font-weight: 600;
      font-size: 18px;
      cursor: text;
    }

    .drum-balls .balls-input { font-size: 18px; }

    .start-button {
      flex: none;
      height: 48px;
      min-width: 200px;
      padding: 0 24px;
      border: none;
      border-radius: 12px;
      background: #fed846;
      color: var(--outline);
      font-family: inherit;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.4px;
      cursor: pointer;
    }

    .start-button:active { transform: translateY(1px); }
    .start-button:disabled { opacity: 0.6; cursor: default; }

    /* Holds the popup at its scaled size so layout around it stays correct */
    .popup-slot {
      position: relative;
      flex: 0 0 auto;
    }

    /* =====================================================
       POPUP (Figma 8009:62585, 360 wide; stretched to full screen height)
       ===================================================== */

    .popup {
      position: absolute;
      top: 0;
      left: 0;
      width: 360px;
      height: 650px;
      background: var(--popup-bg);
      overflow: hidden;
      /* Logo, Rive canvas and rewards stack top to bottom */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: -22px;
      padding: 13px 0 16px;
    }

    /* Full width; height follows the artboard's aspect ratio (set on load),
       capped so logo + canvas + rewards fit: 100% minus logo (~105px),
       two 16px gaps and the 156px rewards panel. ~458px on a 393x852 screen */
    #riveCanvas {
      flex: none;
      width: 100%;
      height: auto;
      max-height: calc(100% - 105px - 32px - 156px);
      display: block;
      touch-action: none;
    }

    .status {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      text-align: center;
      color: #fff;
      font-size: 14px;
      pointer-events: none;
    }

    .abs { position: absolute; }
    .fill { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* ---------- Header logo ---------- */

    .logo {
      flex: none;
      width: 160px;
      height: auto;
    }

    /* ---------- Corner buttons ---------- */

    .close-button {
      position: absolute;
      left: 309px;
      top: 11px;
      z-index: 2;
      display: flex;
      padding: 4px;
      border: none;
      border-radius: 999px;
      background: rgba(40, 45, 113, 0.64);
      cursor: pointer;
    }

    .close-button .icon {
      position: relative;
      width: 20px;
      height: 20px;
      overflow: hidden;
    }

    .close-button .icon > div {
      position: absolute;
      inset: 34.86%;
    }

    .close-button img {
      position: absolute;
      inset: -8.25%;
      width: 116.5%;
      height: 116.5%;
    }

    .help-button {
      position: absolute;
      left: 9.5px;
      top: 13px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 23px;
      height: 24px;
      padding: 6px 8px;
      border: none;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.12);
    }

    .help-button img {
      width: 4.892px;
      height: 7.338px;
    }

    /* ---------- Rewards panel ---------- */

    /* Pushed to the bottom; relative so the tab and title can hang off it */
    .rewards {
      position: relative;
      flex: none;
      margin-top: auto;
      width: 312px;
    }

    .rewards-tab {
      position: absolute;
      left: 50%;
      top: -12.63px;
      width: 126.842px;
      height: 21.363px;
      transform: translateX(-50%);
      border-radius: 12px;
      background: var(--panel-bg);
    }

    .rewards-title {
      position: absolute;
      left: 50%;
      top: -1.94px;
      width: 90px;
      transform: translate(-50%, -50%);
      text-align: center;
      font-weight: 600;
      font-size: 12.621px;
      line-height: 11.683px;
      letter-spacing: 0.3786px;
      white-space: nowrap;
      color: #eeefff;
    }

    .panel {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 156px;
      padding: 9.536px;
      border-radius: 14.304px;
      background: var(--panel-bg);
      overflow: hidden;
    }

    /* Navy outline around white text, as in the design */
    .outlined {
      color: #fff;
      -webkit-text-stroke: 3px var(--outline);
      paint-order: stroke fill;
    }

    /* ---------- Milestone config rows ---------- */

    .milestones {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
    }

    .milestone-row {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 20px;
    }

    .milestone-label {
      flex: none;
      width: 22px;
      font-weight: 700;
      font-size: 12px;
      text-align: center;
    }

    .milestone-color,
    .milestone-cells {
      height: 20px;
      padding: 0 6px;
      border: none;
      border-radius: 6px;
      background: var(--tile-bg);
      color: var(--outline);
      font-family: inherit;
      font-weight: 600;
      font-size: 12px;
    }

    .milestone-color {
      flex: none;
      width: 72px;
      cursor: pointer;
    }

    .milestone-color option { background: var(--panel-bg); }

    .milestone-cells {
      flex: 1 0 0;
      min-width: 1px;
      letter-spacing: 0.4px;
    }

    .milestone-color:disabled,
    .milestone-cells:disabled { opacity: 0.6; cursor: default; }

    /* ---------- Bottom buttons ---------- */

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 30px;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: var(--button-bg);
      color: #fff;
      font-family: inherit;
      font-weight: 500;
      font-size: 12px;
      line-height: 16px;
      letter-spacing: 0.4px;
      white-space: nowrap;
      cursor: pointer;
    }

    .action:active { transform: translateY(1px); }
    .action:disabled { opacity: 0.6; cursor: default; }
    .action.on { background: var(--popup-bg); }

    .balls-input {
      width: 2ch;
      padding: 0;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.7);
      background: transparent;
      color: #fff;
      font: inherit;
      text-align: center;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .balls-input::-webkit-outer-spin-button,
    .balls-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* =====================================================
       BINGO BUTTON (from index_buttons.html, fixed above the tab bar)
       ===================================================== */

    /* Dial centre sits where the minigames FAB does: 47.5px from the
       right edge, 111.5px from the bottom */
    .bingo-button {
      position: absolute;
      right: 15.7px;
      bottom: 72.55px;
      z-index: 1;
      width: 63.6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 6.2px;
      border: 0;
      background: none;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.08s;
    }

    .bingo-button:active { transform: scale(0.94); }

    .bingo-button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
      border-radius: 12px;
    }

    /* Dial layers, outside in: progress ring (5px), a hairline gap, the navy
       disc, then the icon with ~1.5px of navy padding around it. */
    .mg-dial {
      position: relative;
      width: 53.9px;
      height: 53.9px;
      margin-bottom: -2px;
    }

    .mg-dial img {
      position: absolute;
      inset: 7.25px;
      width: calc(100% - 14.5px);
      height: calc(100% - 14.5px);
      border-radius: 50%;
      object-fit: cover;
    }

    .mg-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .mg-ring .disc { fill: #121642; }

    .mg-ring path {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
    }

    .mg-ring .track { stroke: #fff; }

    .mg-ring .fill {
      stroke: #fed846;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
    }

    .mg-value {
      position: absolute;
      left: 50%;
      top: calc(50% + 7.3px);
      transform: translateX(-50%);
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      line-height: 10.861px;
      letter-spacing: 0.19px;
      text-shadow: 0 1px 0 #121642;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .mg-counter {
      position: relative;
      height: 14px;
      min-width: 29.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px 4px;
      border-radius: 888px;
      background: #5e69ff;
      color: #fff;
      font-weight: 500;
      font-size: 12px;
      line-height: 12.3px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="screen" id="screen">

    <button class="bingo-button" id="reopenButton" aria-label="Open Bingo">
      <span class="mg-dial">
        <svg class="mg-ring" viewBox="0 0 53.9 53.9" aria-hidden="true">
          <circle class="disc" cx="26.95" cy="26.95" r="21.2" />
          <path class="track" d="M13.14 47.12A24.45 24.45 0 1 1 43.18 45.24" pathLength="100" />
          <path class="fill" d="M13.14 47.12A24.45 24.45 0 1 1 43.18 45.24" pathLength="100" style="stroke-dashoffset: 91.67;" />
        </svg>
        <img src="./assets/bingo.png" alt="" />
      </span>
      <span class="mg-counter">3d 12h</span>
      <span class="mg-value">1/12</span>
    </button>

    <!-- Lottery drum intro: Start playing draws the balls, then hands over
         to the bingo board -->
    <div class="drum-overlay" id="drumOverlay">
      <canvas id="drumCanvas"></canvas>
      <div class="drum-controls">
        <label class="drum-balls" for="drumBalls">
          <input class="balls-input" id="drumBalls" type="number" min="1" max="99" value="3" />
          <span>balls</span>
        </label>
        <button class="start-button" id="startPlaying" disabled>Start playing</button>
      </div>
    </div>

    <div class="overlay hidden" id="overlay">

      <div class="popup-slot" id="popupSlot">
        <div class="popup" id="popup">

          <!-- Header logo -->
          <img class="logo" src="./logo.png" alt="Happy Hour Bingo" />

          <canvas id="riveCanvas"></canvas>
          <div class="status" id="status">Loading…</div>

          <button class="help-button" aria-label="Help"><img src="./assets/help.svg" alt="" /></button>

          <button class="close-button" id="closeButton" aria-label="Close">
            <span class="icon"><div><img src="./assets/close.svg" alt="" /></div></span>
          </button>

          <!-- Rewards panel -->
          <div class="rewards">
            <div class="panel">

              <!-- One row per BingoVM milestoneN / milestoneNColor pair -->
              <div class="milestones" id="milestones"></div>

              <div class="actions">
                <button class="action" id="showMilestones" disabled>Show milestones</button>
                <label class="action" for="ballsToDrop">
                  <input class="balls-input" id="ballsToDrop" type="number" min="0" max="99" value="2" />
                  <span>balls</span>
                </label>
                <button class="action" id="dropBalls" disabled>Drop balls</button>
              </div>

            </div>

            <div class="rewards-tab"></div>
            <div class="rewards-title outlined">Bingo Rewards</div>
          </div>

        </div>
      </div>


    </div>

  </div>

  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>

  <script>

    // =====================================================
    // CONFIG
    // =====================================================

    const RIVE_SRC = "./bingo-vybs_configurable";
    const VIEW_MODEL = "BingoVM";
    const STATE_MACHINE = "State Machine 1";

    const POPUP_W = 360;
    const POPUP_MIN_H = 480;  // below this, shrink the whole popup instead

    const DRUM_SRC = "./lotterydrum";
    const DRUM_STATE_MACHINE = "State Machine 1";
    const BALLS_TO_DRAW = 3;          // balls input fallback when the drum's ballsToDrop is 0/missing
    const DRAW_TIMEOUT_BASE_MS = 4000;  // only if the drum has no drumEmpty:
    const DRAW_TIMEOUT_PER_BALL_MS = 1500;  // base + per ball


    const canvas = document.getElementById("riveCanvas");
    const statusEl = document.getElementById("status");
    const overlay = document.getElementById("overlay");
    const popup = document.getElementById("popup");
    const popupSlot = document.getElementById("popupSlot");

    const ballsInput = document.getElementById("ballsToDrop");
    const dropButton = document.getElementById("dropBalls");
    const milestonesButton = document.getElementById("showMilestones");
    const milestonesEl = document.getElementById("milestones");

    // Swatch colours for the Milestone enum values (match the old line tiles)
    const MILESTONE_COLORS = {
      none: "var(--tile-bg)",
      green: "#3cd98a",
      pink: "#ff43d0",
      yellow: "#fed846",
      purple: "#bf1dff"
    };

    let props = {};


    // =====================================================
    // LOAD RIVE
    // =====================================================

    const riveAnimation = new rive.Rive({

      src: RIVE_SRC,
      canvas: canvas,
      // Name the state machine up front. Without it the runtime also loads
      // the artboard's first timeline (celebrate_hidden), which keeps
      // forcing the celebration components to opacity 0
      stateMachines: STATE_MACHINE,
      autoplay: true,
      // Bind BingoVM's default instance during load, before the BallTunnel
      // script inits: it reads context:viewModel() once in init, and binding
      // later leaves it without a view model (no stamps/lines/celebration)
      autoBind: true,

      layout: new rive.Layout({
        // Contain: same as fit-width until max-height caps the canvas, then
        // the artboard shrinks to fit instead of being cropped
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.TopCenter
      }),

      onLoad: () => {

        // Size the canvas to the artboard's aspect ratio so height is auto
        const { minX, minY, maxX, maxY } = riveAnimation.bounds;
        canvas.style.aspectRatio = `${maxX - minX} / ${maxY - minY}`;

        const vmi = riveAnimation.viewModelInstance;

        if (!vmi) {
          console.error(`${VIEW_MODEL} instance not bound`);
          statusEl.textContent = "View model not found";
          return;
        }

        props = {
          ballsToDrop: vmi.number("ballsToDrop"),
          dropBalls: vmi.trigger("dropBalls"),
          showMilestones: vmi.boolean("showMilestones"),
          celebrating: vmi.boolean("celebrating")
        };

        for (const [name, prop] of Object.entries(props)) {
          if (!prop) {
            console.error(`${name} not found on ${VIEW_MODEL}`);
          }
        }

        // Seed the ball count from the view model
        if (props.ballsToDrop) ballsInput.value = props.ballsToDrop.value;

        dropButton.disabled = !props.dropBalls;
        milestonesButton.disabled = !props.showMilestones;
        renderMilestones();
        buildMilestoneRows(vmi);

        statusEl.textContent = "";

        resizeRive();

        // Device-mode viewport changes can land right after load
        requestAnimationFrame(resizeRive);
        setTimeout(resizeRive, 100);

      },

      onLoadError: (err) => {
        console.error("RIVE LOAD ERROR:", err);
        statusEl.textContent = "Failed to load bingo";
      }

    });


    // =====================================================
    // CONTROLS
    // =====================================================

    function setBallsToDrop() {
      if (!props.ballsToDrop) return;
      props.ballsToDrop.value = Number(ballsInput.value) || 0;
    }

    ballsInput.addEventListener("input", setBallsToDrop);

    dropButton.addEventListener("click", () => {
      if (!props.dropBalls) return;
      setBallsToDrop();
      // A new drop ends any celebration still showing
      if (props.celebrating?.value) props.celebrating.value = false;
      props.dropBalls.trigger();
      console.log(`dropBalls fired (ballsToDrop = ${props.ballsToDrop?.value})`);
    });

    milestonesButton.addEventListener("click", () => {
      if (!props.showMilestones) return;
      props.showMilestones.value = !props.showMilestones.value;
      renderMilestones();
    });

    function renderMilestones() {
      const on = !!props.showMilestones?.value;
      milestonesButton.classList.toggle("on", on);
      milestonesButton.textContent = on ? "Hide milestones" : "Show milestones";
    }

    // milestoneN is a string of board cells ("B3,I3,N3,G3,O3"),
    // milestoneNColor a Milestone enum (none/green/pink/yellow/purple)
    function buildMilestoneRows(vmi) {
      milestonesEl.innerHTML = "";

      for (let i = 1; i <= 4; i++) {
        const cellsProp = vmi.string(`milestone${i}`);
        const colorProp = vmi.enum(`milestone${i}Color`);
        if (!cellsProp) console.error(`milestone${i} not found on ${VIEW_MODEL}`);
        if (!colorProp) console.error(`milestone${i}Color not found on ${VIEW_MODEL}`);

        const row = document.createElement("div");
        row.className = "milestone-row";

        const label = document.createElement("div");
        label.className = "milestone-label outlined";
        label.textContent = `M${i}`;

        const select = document.createElement("select");
        select.className = "milestone-color";
        select.setAttribute("aria-label", `Milestone ${i} color`);
        for (const value of colorProp?.values ?? Object.keys(MILESTONE_COLORS)) {
          select.add(new Option(value, value));
        }
        select.disabled = !colorProp;
        if (colorProp) select.value = colorProp.value;

        const paintSelect = () => {
          select.style.background = MILESTONE_COLORS[select.value] ?? "var(--tile-bg)";
        };
        paintSelect();

        select.addEventListener("change", () => {
          if (colorProp) colorProp.value = select.value;
          paintSelect();
        });

        const input = document.createElement("input");
        input.className = "milestone-cells";
        input.type = "text";
        input.spellcheck = false;
        input.setAttribute("aria-label", `Milestone ${i} cells`);
        input.disabled = !cellsProp;
        if (cellsProp) input.value = cellsProp.value;

        input.addEventListener("input", () => {
          if (cellsProp) cellsProp.value = input.value.toUpperCase().replace(/\s+/g, "");
        });

        row.append(label, select, input);
        milestonesEl.append(row);
      }
    }

    // =====================================================
    // LOTTERY DRUM INTRO
    // =====================================================

    const drumOverlay = document.getElementById("drumOverlay");
    const drumCanvas = document.getElementById("drumCanvas");
    const startButton = document.getElementById("startPlaying");
    const drumBallsInput = document.getElementById("drumBalls");

    drumBallsInput.value = BALLS_TO_DRAW;

    let drumProps = {};

    function ballsToDraw() {
      return Math.max(1, Math.floor(Number(drumBallsInput.value)) || BALLS_TO_DRAW);
    }

    function setDrumBalls() {
      if (drumProps.ballsToDrop) drumProps.ballsToDrop.value = ballsToDraw();
    }

    drumBallsInput.addEventListener("input", setDrumBalls);

    const drumAnimation = new rive.Rive({

      src: DRUM_SRC,
      canvas: drumCanvas,
      stateMachines: DRUM_STATE_MACHINE,
      autoplay: true,
      // The LotteryDrum script reads the view model in init, so bind on load
      autoBind: true,

      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.Center
      }),

      onLoad: () => {

        const { minX, minY, maxX, maxY } = drumAnimation.bounds;
        drumCanvas.style.aspectRatio = `${maxX - minX} / ${maxY - minY}`;

        const vmi = drumAnimation.viewModelInstance;

        if (!vmi) {
          console.error(`Drum ${VIEW_MODEL} instance not bound`);
          return;
        }

        drumProps = {
          ballsToDrop: vmi.number("ballsToDrop"),
          buttonstart: vmi.trigger("buttonstart"),
          drumEmpty: vmi.boolean("drumEmpty")
        };

        for (const [name, prop] of Object.entries(drumProps)) {
          if (!prop) {
            console.error(`${name} not found on drum ${VIEW_MODEL}`);
          }
        }

        // Seed the input from the view model so it matches the balls the
        // LotteryDrum script put in the sphere at init
        const initialBalls = Math.floor(drumProps.ballsToDrop?.value ?? 0);
        if (initialBalls > 0) {
          drumBallsInput.value = initialBalls;
        } else {
          setDrumBalls();
        }

        startButton.disabled = !drumProps.buttonstart;

        resizeDrum();
        requestAnimationFrame(resizeDrum);

      },

      onLoadError: (err) => {
        console.error("DRUM LOAD ERROR:", err);
        // Don't block the game on a missing intro
        openBoard();
      }

    });

    // The LotteryDrum script sets drumEmpty once the last ball has left the
    // drum. Without that property, fall back to a timeout
    function waitForDraw(balls) {
      return new Promise((resolve) => {
        const prop = drumProps.drumEmpty;

        if (!prop) {
          setTimeout(resolve, DRAW_TIMEOUT_BASE_MS + balls * DRAW_TIMEOUT_PER_BALL_MS);
          return;
        }

        const onChange = () => {
          if (!prop.value) return;
          prop.off(onChange);
          resolve();
        };

        prop.on(onChange);
      });
    }

    startButton.addEventListener("click", async () => {
      if (!drumProps.buttonstart) return;
      startButton.disabled = true;
      drumBallsInput.disabled = true;

      const balls = ballsToDraw();
      drumBallsInput.value = balls;
      setDrumBalls();
      const drawn = waitForDraw(balls);
      drumProps.buttonstart.trigger();
      console.log(`buttonstart fired (ballsToDrop = ${balls})`);

      await drawn;
      openBoard();
    });

    function openBoard() {
      drumOverlay.classList.add("hidden");
      overlay.classList.remove("hidden");
      requestAnimationFrame(resizeRive);
      // The intro is done; free its renderer
      setTimeout(() => drumAnimation.cleanup(), 300);
    }

    function resizeDrum() {
      if (drumOverlay.classList.contains("hidden")) return;
      drumAnimation.resizeDrawingSurfaceToCanvas();
    }

    window.addEventListener("resize", resizeDrum);

    // =====================================================
    // POPUP OPEN / CLOSE
    // =====================================================

    document.getElementById("closeButton").addEventListener("click", () => {
      overlay.classList.add("hidden");
    });

    document.getElementById("reopenButton").addEventListener("click", () => {
      overlay.classList.remove("hidden");
      requestAnimationFrame(resizeRive);
    });


    // =====================================================
    // RESIZE
    // =====================================================

    // Scale the popup to the screen width and stretch it to the full screen
    // height (the Rive area absorbs the extra). On very short browsers the
    // whole popup shrinks instead so it never drops below POPUP_MIN_H.
    function fitPopup() {
      const availW = overlay.clientWidth;
      const availH = overlay.clientHeight;
      const scale = Math.min(availW / POPUP_W, availH / POPUP_MIN_H);
      const height = availH / scale;

      // zoom, not transform: scale(), so the canvas is laid out at its real
      // pixel size. A transform resamples the Rive bitmap and blurs it
      popup.style.zoom = scale;
      popup.style.height = `${height}px`;
      popupSlot.style.width = `${POPUP_W * scale}px`;
      popupSlot.style.height = `${height * scale}px`;
    }

    function resizeRive() {
      fitPopup();
      riveAnimation.resizeDrawingSurfaceToCanvas();
    }

    window.addEventListener("resize", resizeRive);

    new ResizeObserver(resizeRive).observe(overlay);

    window.addEventListener("orientationchange", () => {
      setTimeout(resizeRive, 100);
    });

    fitPopup();

  </script>

</body>
</html>
