<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Album</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0F1129; }
    body { display: flex; justify-content: center; }
    .stage { position: relative; width: 100%; max-width: 393px; height: 100%; overflow: hidden; }
    #riveCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  </style>
</head>
<body>
  <div class="stage"><canvas id="riveCanvas"></canvas></div>
  <script src="https://unpkg.com/@rive-app/canvas@2.47.1"></script>
  <script>
    const canvas = document.getElementById("riveCanvas");
    const r = new rive.Rive({
      src: "./album.riv",
      canvas,
      artboard: "Artboard",
      stateMachines: "State Machine 1",
      autoplay: true,
      autoBind: true, // binds the artboard's view model (AlbumVM) default instance
      // Referenced (non-embedded) assets live next to album.riv, e.g. "star-7377791.png"
      assetLoader: (asset, bytes) => {
        if (bytes.length > 0 || asset.cdnUuid.length > 0) return false; // embedded / CDN
        if (!asset.isImage) return false;
        fetch("./" + asset.uniqueFilename)
          .then((res) => { if (!res.ok) throw new Error(res.status + " " + asset.uniqueFilename); return res.arrayBuffer(); })
          .then((buf) => rive.decodeImage(new Uint8Array(buf)))
          .then((image) => { asset.setRenderImage(image); image.unref(); })
          .catch((e) => console.error("Asset load failed:", e));
        return true;
      },
      layout: new rive.Layout({ fit: rive.Fit.FitWidth, alignment: rive.Alignment.TopCenter }),
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        window.albumVM = r.viewModelInstance; // AlbumVM instance, for debugging
        console.log("Rive loaded. State machines:", r.stateMachineNames,
          "View model:", r.viewModelInstance ? "bound" : "none");
      },
      onLoadError: (err) => console.error("Rive load error:", err)
    });
    window.addEventListener("resize", () => r.resizeDrawingSurfaceToCanvas());
  </script>
</body>
</html>
