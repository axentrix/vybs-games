<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vybs Minigames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --yellow400: #fed846;
      --pulse-blue: rgba(94, 105, 255, 0.5);
      --pulse-yellow: rgba(254, 216, 70, 0.5);
      --pulse-pink: rgba(245, 67, 142, 0.5);
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0d0a14;
      font-family: "Kanit", system-ui, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =====================================================
       SCREEN
       ===================================================== */

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 360px;
      max-height: 852px;
      border-radius: 24px;
      background: var(--white) url("./main.png") center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* =====================================================
       FAB (minigames)
       ===================================================== */

    /* FAB and menu share one anchor: the close button replaces the FAB
       at the same centre point, and the menu grows up out of it. */
    .fab,
    .minigames {
      --anchor-x: 47.5px;   /* FAB centre, from the screen's right edge */
      --anchor-y: 111.5px;  /* FAB centre, from the screen's bottom edge */
    }

    .fab {
      position: absolute;
      right: calc(var(--anchor-x) - 29.26px);
      bottom: calc(var(--anchor-y) - 29.26px);
      z-index: 5;
      width: 58.52px;
      height: 58.52px;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    }

    .fab.hidden {
      transform: scale(0.3) rotate(-90deg);
      opacity: 0;
      pointer-events: none;
    }

    .fab-button {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--white);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
      cursor: pointer;
      transition: transform 0.08s;
    }

    /* Navy button with the design's 7px, 64% pink stroke, drawn as the two
       solid colours Figma renders it as (light over the white disc, deep over
       the navy) so nothing behind can show through. */
    .fab-core {
      width: 52.93px;
      height: 52.93px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3.5px solid #f987b7;
      border-radius: 50%;
      background: #121642;
      box-shadow: inset 0 0 0 3.5px #a33373;
    }

    .fab-core img {
      width: 23.51px;
      height: 23.51px;
    }

    .fab-button:active { transform: scale(0.94); }

    .fab-button:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 3px;
    }

    /* Three rings expand out from behind the button, one after another. */
    .pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      opacity: 0;
      animation: pulse 2.4s ease-out infinite;
      pointer-events: none;
    }

    .pulse-blue   { background: var(--pulse-blue); }
    .pulse-yellow { background: var(--pulse-yellow); animation-delay: 0.8s; }
    .pulse-pink   { background: var(--pulse-pink);   animation-delay: 1.6s; }

    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* ---------- Menu ---------- */

    .minigames {
      position: absolute;
      right: calc(var(--anchor-x) - 33.8px);
      bottom: calc(var(--anchor-y) - 20px);
      z-index: 6;
      width: 67.6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .minigames.open { pointer-events: auto; }

    .mg-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      padding: 4px 2px 8px;
      border-radius: 44px;
      background: rgba(252, 252, 252, 0.54);
      box-shadow: 3px 5px 7.8px rgba(0, 0, 0, 0.25);
      transform-origin: 50% 100%;
      transform: translateY(24px) scaleY(0.15) scaleX(0.6);
      opacity: 0;
      transition:
        transform 0.3s cubic-bezier(0.5, 0, 0.75, 0),
        opacity 0.2s ease 0.1s;
    }

    .minigames.open .mg-panel {
      transform: none;
      opacity: 1;
      transition:
        transform 0.55s cubic-bezier(0.34, 1.4, 0.64, 1),
        opacity 0.2s ease;
    }

    .mg-item {
      position: relative;
      width: 63.6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 6.2px;
      text-decoration: none;
      opacity: 0;
      transform: translateY(14px) scale(0.6);
      transition: opacity 0.15s ease, transform 0.2s ease;
    }

    /* Items pop in bottom-up, staggered by --i (0 = closest to the FAB). */
    .minigames.open .mg-item {
      opacity: 1;
      transform: none;
      transition:
        opacity 0.3s ease calc(0.12s + var(--i) * 0.08s),
        transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) calc(0.12s + var(--i) * 0.08s);
    }

    /* Dial layers, outside in: progress ring (5px), a hairline gap, the navy
       disc, then the icon with ~1.5px of navy padding around it. */
    .mg-dial {
      position: relative;
      width: 53.9px;
      height: 53.9px;
      margin-bottom: -2px;
    }

    .mg-dial img {
      position: absolute;
      inset: 7.25px;
      width: calc(100% - 14.5px);
      height: calc(100% - 14.5px);
      border-radius: 50%;
      object-fit: cover;
    }

    .mg-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .mg-ring .disc { fill: #121642; }

    .mg-ring path {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
    }

    .mg-ring .track { stroke: var(--white); }

    .mg-ring .fill {
      stroke: var(--yellow400);
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
    }

    .mg-value {
      position: absolute;
      left: 50%;
      top: calc(50% + 7.3px);
      transform: translateX(-50%);
      color: var(--white);
      font-weight: 600;
      font-size: 12px;
      line-height: 10.861px;
      letter-spacing: 0.19px;
      text-shadow: 0 1px 0 #121642;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .mg-counter {
      position: relative;
      height: 14px;
      min-width: 29.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px 4px;
      border-radius: 888px;
      background: #5e69ff;
      color: var(--white);
      font-weight: 500;
      font-size: 12px;
      line-height: 12.3px;
      white-space: nowrap;
    }

    .mg-close {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-top: 2px solid #eaeaea;
      border-radius: 44px;
      background: rgba(252, 252, 252, 0.88);
      backdrop-filter: blur(2.4px);
      cursor: pointer;
      transform: scale(0) rotate(90deg);
      transition: transform 0.25s cubic-bezier(0.5, 0, 0.75, 0);
    }

    .minigames.open .mg-close {
      transform: none;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .mg-close:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
      .fab, .mg-panel, .mg-item, .mg-close,
      .minigames.open .mg-panel, .minigames.open .mg-item, .minigames.open .mg-close {
        transition-duration: 0.01s;
        transition-delay: 0s;
      }
    }
  </style>
</head>
<body>

  <div class="screen">
    <div class="fab" id="fab">
      <span class="pulse pulse-blue"></span>
      <span class="pulse pulse-yellow"></span>
      <span class="pulse pulse-pink"></span>
      <button class="fab-button" id="fabBtn" aria-label="Open minigames" aria-expanded="false" aria-controls="minigames">
        <span class="fab-core">
          <img src="./assets/ticket.svg" alt="" />
        </span>
      </button>
    </div>

    <nav class="minigames" id="minigames" aria-label="Minigames" aria-hidden="true">
      <div class="mg-panel">
        <a class="mg-item" href="#" style="--i: 3" aria-label="Game Rush"
           data-progress="0.2400" data-count="24" data-format="percent">
          <div class="mg-dial">
            <svg class="mg-ring" viewBox="0 0 53.9 53.9" aria-hidden="true">
              <circle class="disc" cx="26.95" cy="26.95" r="21.2" />
              <path class="track" d="M13.14 47.12A24.45 24.45 0 1 1 43.18 45.24" pathLength="100" />
              <path class="fill" d="M13.14 47.12A24.45 24.45 0 1 1 43.18 45.24" pathLength="100" />
            </svg>
            <img src="./assets/gamerush.png" alt="" />
          </div>
          <span class="mg-counter">3d 12h</span>
          <span class="mg-value">0</span>
        </a>

        <a class="mg-item" href="#" style="--i: 2" aria-label="Bingo"
           data-progress="0.0833" data-count="1" data-format="of12">
          <div class="mg-dial">
            <svg class="mg-ring" viewBox="0 0 53.9 53.9" aria-hidden="true">
              <circle class="disc" cx="26.95" cy="26.95" r="21.2" />
              <path class="track" d="M13.14 47.12A24.45 24.45 0 1 1 43.18 45.24" pathLength="100" />
              <path class="fill" d="M13.14 47.12A24.45 24.45 0 1 1 43.18 45.24" pathLength="100" />
            </svg>
            <img src="./assets/bingo.png" alt="" />
          </div>
          <span class="mg-counter">3d 12h</span>
          <span class="mg-value">0</span>
        </a>

        <a class="mg-item" href="#" style="--i: 1" aria-label="Stepper"
           data-progress="0.1800" data-count="2450" data-format="number">
          <div class="mg-dial">
            <svg class="mg-ring" viewBox="0 0 53.9 53.9" aria-hidden="true">
              <circle class="disc" cx="26.95" cy="26.95" r="21.2" />
              <path class="track" d="M13.14 47.12A24.45 24.45 0 1 1 43.18 45.24" pathLength="100" />
              <path class="fill" d="M13.14 47.12A24.45 24.45 0 1 1 43.18 45.24" pathLength="100" />
            </svg>
            <img src="./assets/stepper.png" alt="" />
          </div>
          <span class="mg-counter">3d 12h</span>
          <span class="mg-value">0</span>
        </a>

        <a class="mg-item" href="#" style="--i: 0" aria-label="Puzzle"
           data-progress="0.0833" data-count="1" data-format="of12">
          <div class="mg-dial">
            <svg class="mg-ring" viewBox="0 0 53.9 53.9" aria-hidden="true">
              <circle class="disc" cx="26.95" cy="26.95" r="21.2" />
              <path class="track" d="M13.14 47.12A24.45 24.45 0 1 1 43.18 45.24" pathLength="100" />
              <path class="fill" d="M13.14 47.12A24.45 24.45 0 1 1 43.18 45.24" pathLength="100" />
            </svg>
            <img src="./assets/puzzle.png" alt="" />
          </div>
          <span class="mg-counter">31d 12h</span>
          <span class="mg-value">0</span>
        </a>
      </div>

      <button class="mg-close" id="mgCloseBtn" aria-label="Close minigames">
        <img src="./assets/close.svg" alt="" />
      </button>
    </nav>
  </div>

  <script>

    // =====================================================
    // MINIGAMES MENU
    // =====================================================

    const fabEl = document.getElementById("fab");
    const fabBtn = document.getElementById("fabBtn");
    const menuEl = document.getElementById("minigames");
    const menuCloseBtn = document.getElementById("mgCloseBtn");
    const menuItems = [...menuEl.querySelectorAll(".mg-item")];

    // Wait for the panel and items to land, then fill one bar at a time.
    const FILL_START_MS = 650;
    const FILL_STAGGER_MS = 280;
    const FILL_DURATION_MS = 700;

    let fillTimers = [];
    let fillFrames = [];

    function formatValue(value, format) {
      if (format === "percent") return value + "%";
      if (format === "of12") return value + "/12";
      return value.toLocaleString("en-US");
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function fillItem(item) {
      const fill = item.querySelector(".fill");
      const valueEl = item.querySelector(".mg-value");
      const progress = parseFloat(item.dataset.progress);
      const target = parseInt(item.dataset.count, 10);
      const format = item.dataset.format;
      const start = performance.now();

      function step(now) {
        const t = Math.min(1, (now - start) / FILL_DURATION_MS);
        const eased = easeOutCubic(t);
        fill.style.strokeDashoffset = 100 - progress * 100 * eased;
        fill.style.opacity = eased > 0 ? 1 : 0;
        valueEl.textContent = formatValue(Math.round(target * eased), format);
        if (t < 1) {
          fillFrames.push(requestAnimationFrame(step));
        }
      }

      fillFrames.push(requestAnimationFrame(step));
    }

    function resetFills() {
      fillTimers.forEach(clearTimeout);
      fillFrames.forEach(cancelAnimationFrame);
      fillTimers = [];
      fillFrames = [];

      menuItems.forEach((item) => {
        const fill = item.querySelector(".fill");
        fill.style.strokeDashoffset = 100;
        // A zero-length dash still draws its round cap as a dot.
        fill.style.opacity = 0;
        item.querySelector(".mg-value").textContent = formatValue(0, item.dataset.format);
      });
    }

    function openMenu() {
      resetFills();
      fabEl.classList.add("hidden");
      menuEl.classList.add("open");
      menuEl.setAttribute("aria-hidden", "false");
      fabBtn.setAttribute("aria-expanded", "true");

      // Top to bottom, one after another.
      menuItems.forEach((item, index) => {
        fillTimers.push(setTimeout(() => fillItem(item), FILL_START_MS + index * FILL_STAGGER_MS));
      });

      menuCloseBtn.focus({ preventScroll: true });
    }

    function closeMenu() {
      menuEl.classList.remove("open");
      menuEl.setAttribute("aria-hidden", "true");
      fabEl.classList.remove("hidden");
      fabBtn.setAttribute("aria-expanded", "false");
      fabBtn.focus({ preventScroll: true });

      // Let the close animation play before the bars empty again.
      fillTimers.forEach(clearTimeout);
      fillTimers = [setTimeout(resetFills, 350)];
    }

    fabBtn.addEventListener("click", openMenu);
    menuCloseBtn.addEventListener("click", closeMenu);

    menuItems.forEach((item) => {
      item.addEventListener("click", (event) => event.preventDefault());
    });

    resetFills();

  </script>
</body>
</html>
