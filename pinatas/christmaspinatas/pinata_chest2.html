<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pinata Chest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;800&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0F1129;
    }

    body { 
      display: flex;
      justify-content: center;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 393px;
      height: 100%;
      background: #0F1129;
      overflow: hidden;
    }

    #riveCanvas {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height:100%;
      display: block;
      touch-action: manipulation;
    }

    /* =====================================================
       COLLECT OVERLAY (Figma "Collect" 419:51502)
       Shown once the chest animation reaches its Exit state.
       ===================================================== */

    .collect {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      
      overflow: hidden;
      font-family: "Kanit", system-ui, sans-serif;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .collect.show { opacity: 1; }
    .collect[hidden] { display: none; }

    /* Header */
    .c-header {
      position: relative;
      z-index: 2;
      flex: none;
      height: 75px;
      box-sizing: border-box;
      padding: 12px;
      background: #fff;
      border-bottom: 2px solid #d9d9d9;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .avatar-level { position: relative; width: 76px; height: 42px; overflow: hidden; flex: none; }
    .level-pill {
      position: absolute; left: 18px; top: 6px; width: 58px; height: 32px; box-sizing: border-box;
      padding: 0 8px 0 24px; border-radius: 888px; background: #e8efff;
      display: flex; align-items: center;
    }
    .level-pill .lvl { display: flex; flex-direction: column; align-items: center; }
    .level-pill .star { width: 18.598px; height: 18.598px; margin-bottom: -2px; display: flex; align-items: center; justify-content: center; overflow: visible; }
    /* The 39px star art is placed in an 18.6px slot, as in the design */
    .level-pill .star img { width: 39px; height: 39px; flex: none; transform: scale(0.4769); }
    .level-pill .lvl-text { font-size: 10px; line-height: 12px; letter-spacing: -0.3px; color: #5e69ff; white-space: nowrap; }
    .progress-circle { position: absolute; left: 0; top: 0; width: 42.029px; height: 42.029px; }

    .avatar {
      position: absolute; left: 0; top: 0; width: 42px; height: 42px; border-radius: 888px;
      background: #d7dafe; display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
    }
    .av-grid { display: inline-grid; grid-template: max-content / max-content; place-items: start; line-height: 0; }
    .av-grid > * { grid-area: 1 / 1; }
    .av-body { margin: 3.96px 0 0 6.48px; }
    .av-soft { margin: 1.35px 0 0 3.02px; opacity: 0.4; mix-blend-mode: soft-light; }
    .av-v {
      position: relative; display: block;
      -webkit-mask: url("collect/av-mask.svg") var(--mp) / 40.741px 40.741px no-repeat;
              mask: url("collect/av-mask.svg") var(--mp) / 40.741px 40.741px no-repeat;
      -webkit-mask-clip: no-clip; mask-clip: no-clip; mask-mode: alpha;
    }
    .av-v > img, .av-inset > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; max-width: none; }
    .av-inset { position: absolute; }

    .c-header-mid { display: flex; align-items: center; gap: 8px; }
    .pill { height: 32px; box-sizing: border-box; padding: 0 8px; border-radius: 12px; display: flex; align-items: center; gap: 4px; }
    .pill.balance { background: #e8ffdd; }
    .pill.raffle { background: #fff4e9; }
    .cash-stack { width: 27.607px; display: flex; justify-content: center; }
    .cash-stack .stack { display: inline-grid; line-height: 0; place-items: start; }
    .cash-stack .stack img { grid-area: 1 / 1; width: 27.229px; height: 13.139px; }
    .pill-value {
      font-weight: 800; font-size: 16px; letter-spacing: -0.48px; white-space: nowrap;
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .balance .pill-value { background-image: linear-gradient(180.42deg, #eff8ce 31.454%, #fff 45.615%, #e0f0c3 59.775%, #cdff74 73.936%); }
    .raffle .pill-value { background-image: linear-gradient(181.9deg, #f8eece 31.454%, #ffd83d 73.936%); }
    .raffle .ticket-wrap { width: 25.507px; height: 25.311px; display: flex; align-items: center; justify-content: center; }
    .raffle .ticket-wrap img { width: 22.893px; height: 17.061px; }
    .c-header-right { width: 76px; height: 42px; display: flex; align-items: center; justify-content: flex-end; }
    .c-header-right img { display: block; }

    /* Panel */
    .c-panel {
      flex: 1 1 0; min-height: 0;
      background: #0f1129; 
      /* box-shadow, not filter: a filter would trap the content in its own
         layer, and the full-screen happyend canvas must sit between them */
      box-shadow: 0 4px 2px rgba(0, 0, 0, 0.25);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 32px 0;
      box-sizing: border-box;
    }
    .c-title { position: relative; z-index: 2; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; width: 100%; }
    .c-title h1 { margin: 0; font-weight: 600; font-size: 32px; line-height: 32px; letter-spacing: 0.96px; color: #eeefff; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.25); }
    .c-title p { margin: 0; width: 252px; font-size: 18px; line-height: 18px; letter-spacing: 0.4px; color: #fff; }

    .c-artwork { position: relative; flex: 1 1 0; min-height: 0; width: 100%; box-sizing: border-box; padding: 0 12px; }
    /* happyend1.riv: full screen, above the panel background, behind the $5 */
    #happyCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; pointer-events: none;
      /* The Rive artboard has hard edges; fade them out softly. --hx/--hy are
         half the artboard's drawn size, set in happyLayout() */
      -webkit-mask-image: radial-gradient(ellipse var(--hx, 50%) var(--hy, 50%) at 50% 50%, #000 60%, transparent 100%);
              mask-image: radial-gradient(ellipse var(--hx, 50%) var(--hy, 50%) at 50% 50%, #000 60%, transparent 100%);
    }
    .reward {
      position: absolute; z-index: 2; left: calc(50% + 0.5px); top: calc(50% + 0.08px); transform: translate(-50%, -50%);
      width: 128px; height: 71.111px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    }
    .reward .cash { position: absolute; left: 27.11px; top: -2.49px; width: 73.781px; height: 56.051px; }
    .reward .amount { position: relative; font-weight: 800; font-size: 40px; line-height: 44.674px; letter-spacing: -1.2px; color: #fff; white-space: nowrap; }

    .c-actions { position: relative; z-index: 2; width: 100%; box-sizing: border-box; padding: 12px 24px 0; }
    .collect-btn {
      position: relative; width: 100%; height: 54px; border: none; border-radius: 8px;
      background: #5e69ff; color: #fff; cursor: pointer;
      font: 500 18px/16px "Kanit", system-ui, sans-serif; letter-spacing: 0.1px;
      box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.08);
      filter: drop-shadow(0 8px 0 rgba(94, 105, 255, 0.32));
    }
    .collect-btn:active { transform: translateY(2px); }
    .collect-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .collect-btn:disabled { cursor: default; }

    /* trial_currency.riv token trail, over everything */
    #currencyCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 10; pointer-events: none; }
    #currencyCanvas[hidden] { display: none; }
  </style>
</head>

  <script src="https://unpkg.com/@rive-app/canvas@2.47.1"></script>
  <script>
    const canvas = document.getElementById("riveCanvas");

    // The chest only opens with the key
    const KEY_UNLOCK = true;

    const r = new rive.Rive({
      src: "./pinata_chest_christmas2.riv",
      canvas,
      artboard: "Artboard",
      stateMachines: "State Machine 3",
      autoplay: true,
      autoBind: true,
      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.TopCenter
      }),
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        const keyUnlock = r.viewModelInstance?.boolean("keyUnlock");
        if (keyUnlock) keyUnlock.value = KEY_UNLOCK;
        else console.warn("keyUnlock not found on the view model");
      },
      onStateChange: (e) => console.log("Rive state:", e.data || []),
      onLoadError: (err) => console.error("Rive load error:", err)
    });


    // =====================================================
    // COLLECT OVERLAY
    // =====================================================

    const collect = document.getElementById("collect");
    const happyCanvas = document.getElementById("happyCanvas");
    const currencyCanvas = document.getElementById("currencyCanvas");
    const collectBtn = document.getElementById("collectBtn");
    const reward = document.getElementById("reward");
    const balancePill = document.getElementById("balancePill");
    let happy = null;
    let currency = null;

    // Shifts the full-screen happyend canvas down so its centre sits right
    // behind the dollars (the $5 is below the screen centre)
    function centerHappyOnReward() {
      const box = collect.getBoundingClientRect();
      const b = reward.getBoundingClientRect();
      const dy = (b.top + b.height / 2) - (box.top + box.height / 2);
      happyCanvas.style.top = dy + "px";
    }

    // happyend size relative to the full-screen fit. The canvas stays full
    // screen and the animation is drawn smaller inside it (layout bounds),
    // so anything reaching past that area is still drawn, not cut off.
    const HAPPY_SCALE = 0.5;

    function happyLayout() {
      const w = happyCanvas.width;   // drawing-surface pixels
      const h = happyCanvas.height;
      const dx = (w * (1 - HAPPY_SCALE)) / 2;
      const dy = (h * (1 - HAPPY_SCALE)) / 2;

      // Fade the edges of the artboard as it is actually drawn (Cover keeps
      // its proportions, so it is not squeezed into the tall screen shape)
      const aw = happy?.artboardWidth, ah = happy?.artboardHeight;
      if (aw && ah) {
        const cssPerPx = happyCanvas.clientWidth / w;
        const s = Math.max((w - 2 * dx) / aw, (h - 2 * dy) / ah);
        happyCanvas.style.setProperty("--hx", (aw * s * cssPerPx) / 2 + "px");
        happyCanvas.style.setProperty("--hy", (ah * s * cssPerPx) / 2 + "px");
      }
      return new rive.Layout({
        fit: rive.Fit.Cover,
        alignment: rive.Alignment.Center,
        minX: dx, minY: dy, maxX: w - dx, maxY: h - dy
      });
    }

    function showCollect() {
      collect.hidden = false;
      centerHappyOnReward();
      requestAnimationFrame(() => requestAnimationFrame(() => collect.classList.add("show")));

      // happyend1 is a plain .riv file without an extension
      happy = new rive.Rive({
        src: "./happyend1",
        canvas: happyCanvas,
        stateMachines: "State Machine 1",
        autoplay: true,
        autoBind: true,
        layout: happyLayout(),
        onLoad: () => {
          happy.resizeDrawingSurfaceToCanvas();
          happy.layout = happyLayout();
        },
        onLoadError: (err) => console.error("happyend1 load error:", err)
      });
    }

    // Collect: tokens fly from the $5 to the balance in the header
    const CURRENCY_ANIMATION_TYPE = 1;
    const CURRENCY_TOKEN = 1;        // particleType
    const CURRENCY_MS = 3500;        // the trail is removed after this long
    // Size of the tokens / confetti relative to the Rive file. The canvas
    // stays full screen and the artboard grows to fill it, so nothing is cut.
    const CURRENCY_SCALE = 0.7;

    collectBtn.addEventListener("click", () => {
      if (currency) return;
      collectBtn.disabled = true;
      currencyCanvas.hidden = false;

      currency = new rive.Rive({
        src: "./trial_currency.riv",
        canvas: currencyCanvas,
        stateMachines: "State Machine 1",
        autoplay: true,
        // Fit.Layout: the artboard takes the canvas size; layoutScaleFactor
        // draws its content smaller while the artboard still spans the screen
        layout: new rive.Layout({ fit: rive.Fit.Layout, layoutScaleFactor: CURRENCY_SCALE, alignment: rive.Alignment.Center }),
        // trial_currency.riv references its images; they sit next to it
        assetLoader: (asset, bytes) => {
          if (!asset.isImage || bytes.length > 0) return false;
          fetch("./" + asset.uniqueFilename)
            .then((res) => { if (!res.ok) throw new Error(res.status + " " + asset.uniqueFilename); return res.arrayBuffer(); })
            .then((buf) => rive.decodeImage(new Uint8Array(buf)))
            .then((image) => { asset.setRenderImage(image); image.unref(); })
            .catch((e) => console.error("Asset load failed:", e));
          return true;
        },
        onLoad: () => {
          currency.resizeDrawingSurfaceToCanvas();
          const vm = currency.viewModelByName("CurrencyVM");
          if (!vm) { console.warn("CurrencyVM not found"); return; }
          const vmi = vm.defaultInstance() || vm.instance();
          currency.bindViewModelInstance(vmi);

          const stageRect = currencyCanvas.getBoundingClientRect();
          const center = (el) => {
            const b = el.getBoundingClientRect();
            // CSS pixels -> artboard units (they differ by CURRENCY_SCALE)
            const kx = currency.artboardWidth / stageRect.width;
            const ky = currency.artboardHeight / stageRect.height;
            return {
              x: (b.left + b.width / 2 - stageRect.left) * kx,
              y: (b.top + b.height / 2 - stageRect.top) * ky
            };
          };
          const from = center(reward);
          const to = center(balancePill);
          const set = (name, value) => {
            const prop = vmi.number(name);
            if (prop) prop.value = value;
            else console.warn(`${name} not found on CurrencyVM`);
          };
          set("animationType", CURRENCY_ANIMATION_TYPE);
          set("particleType", CURRENCY_TOKEN);
          set("startX", from.x);
          set("startY", from.y);
          set("endX", to.x);
          set("endY", to.y);

          vmi.trigger("confettiTrigger")?.trigger();

          setTimeout(() => {
            currency.cleanup();
            currencyCanvas.hidden = true;
          }, CURRENCY_MS);
        },
        onLoadError: (err) => console.error("trial_currency load error:", err)
      });
    });

    window.addEventListener("resize", () => {
      r.resizeDrawingSurfaceToCanvas();
      if (!collect.hidden) centerHappyOnReward();
      if (happy) {
        happy.resizeDrawingSurfaceToCanvas();
        happy.layout = happyLayout();
      }
    });
  </script>
</body>
</html>
