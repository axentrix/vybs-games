<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pinata Basic</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0F1129;
    }

    body { 
      display: flex;
      justify-content: center;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 393px;
      height: 100%;
      background: #0F1129 url("chestbg.png") center top / cover no-repeat;
      overflow: hidden;
    }

    #riveCanvas {
      position: absolute;
      /* start just below the "Use Key" toggle */
      top: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height:100%;
      display: block;
      touch-action: manipulation;
    }

    /* "Use Key" toggle, top of the screen */
    .key-toggle {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font: 600 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .key-toggle input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .key-toggle .switch {
      position: relative;
      width: 42px;
      height: 24px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.3);
      transition: background 0.2s;
    }

    .key-toggle .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }

    .key-toggle input:checked + .switch { background: #34C759; }
    .key-toggle input:checked + .switch::after { transform: translateX(18px); }
    .key-toggle input:focus-visible + .switch { outline: 2px solid #fff; outline-offset: 2px; }

    /* "Tap to Play" pill over the chest. Taps pass through to the canvas.
       Adjust --pill-top to move it up/down relative to the chest. */
    .tap-pill {
      --pill-top: 45%;
      position: absolute;
      top: var(--pill-top);
      left: 50%;
      z-index: 2;
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font: 700 17px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.02em;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: pill-pulse 1.2s ease-in-out infinite;
      transition: opacity 0.25s;
    }

    .tap-pill.hidden {
      opacity: 0;
      animation-play-state: paused;
    }

    @keyframes pill-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(1.08); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="riveCanvas"></canvas>
    <label class="key-toggle">
      <span>Use Key</span>
      <input type="checkbox" id="useKey" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>
    <div class="tap-pill" id="tapPill">Tap to Play</div>
  </div>

  <script src="https://unpkg.com/@rive-app/canvas@2.47.1"></script>
  <script>
    const canvas = document.getElementById("riveCanvas");

    const useKey = document.getElementById("useKey");
    const tapPill = document.getElementById("tapPill");
    let r = null;

    // The key and the chest are both drawn on the canvas, so the first tap
    // on it hides the pill
    canvas.addEventListener("pointerdown", () => tapPill.classList.add("hidden"));

    // Creates the Rive instance from scratch, with keyUnlock set from the toggle
    function startRive() {
      if (r) r.cleanup();
      tapPill.classList.remove("hidden"); // fresh start: show the pill again

      const inst = new rive.Rive({
        src: "./pinata_chest.riv",
        canvas,
        artboard: "Artboard",
        stateMachines: "State Machine 3",
        autoplay: true,
        autoBind: true,
        layout: new rive.Layout({
          fit: rive.Fit.Contain,
          alignment: rive.Alignment.TopCenter
        }),
        onLoad: () => {
          if (inst !== r) return; // a newer restart replaced this one
          inst.resizeDrawingSurfaceToCanvas();
          const keyUnlock = inst.viewModelInstance?.boolean("keyUnlock");
          if (keyUnlock) keyUnlock.value = useKey.checked;
          else console.warn("keyUnlock not found on the view model");
        },
        onLoadError: (err) => console.error("Rive load error:", err)
      });

      r = inst;
    }

    startRive();

    // "Use Key" toggle: restart the file with the new keyUnlock value
    useKey.addEventListener("change", startRive);

    window.addEventListener("resize", () => r?.resizeDrawingSurfaceToCanvas());
  </script>
</body>
</html>
