<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pinata Basic</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0F1129;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 393px;
      height: 100%;
      background: #0F1129 url("advanced.png") center top / cover no-repeat;
      overflow: hidden;
    }

    #riveCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="riveCanvas"></canvas>
  </div>

  <script src="https://unpkg.com/@rive-app/canvas@2.47.1"></script>
  <script>
    const canvas = document.getElementById("riveCanvas");

    const r = new rive.Rive({
      src: "./pinata_basic.riv",
      canvas,
      artboard: "Artboard",
      stateMachines: "State Machine 3",
      autoplay: true,
      autoBind: true,
      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.TopCenter
      }),
      onLoad: () => r.resizeDrawingSurfaceToCanvas(),
      onLoadError: (err) => console.error("Rive load error:", err)
    });

    window.addEventListener("resize", () => r.resizeDrawingSurfaceToCanvas());
  </script>
</body>
</html>
